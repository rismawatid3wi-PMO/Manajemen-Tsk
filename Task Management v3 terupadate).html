<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Management — Prototipe klik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EC;--surface:#FBFCFB;--ink:#17211D;--muted:#5B6862;--line:#CFD7D1;--line2:#E4E9E5;
  --pine:#1E4D40;--pine-ink:#F2F7F4;--side:#14302A;--side-ink:#D5E3DC;--side-mut:#8FA69C;--side-act:#22493F;
  --todo:#7C8A93;--prog:#3468D6;--done:#2C9A68;--late:#C23B2B;--wk:rgba(23,33,29,.05);--focus:#3468D6;--warn:#B7791F;
  --tint:color-mix(in srgb,var(--ink) 4%,var(--paper));
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0F1512;--surface:#171F1B;--ink:#E6ECE8;--muted:#9AA8A1;--line:#2C3832;--line2:#232D28;--pine:#5FB79E;--pine-ink:#0C1613;--wk:rgba(255,255,255,.05);--todo:#93A0A8;--prog:#7AA0F2;--done:#4CBE8A;--late:#EE7565;--focus:#7AA0F2;--warn:#E0A94A}
}
:root[data-theme="dark"]{--paper:#0F1512;--surface:#171F1B;--ink:#E6ECE8;--muted:#9AA8A1;--line:#2C3832;--line2:#232D28;--pine:#5FB79E;--pine-ink:#0C1613;--wk:rgba(255,255,255,.05);--todo:#93A0A8;--prog:#7AA0F2;--done:#4CBE8A;--late:#EE7565;--focus:#7AA0F2;--warn:#E0A94A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}h4{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
p{margin:0}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mut{color:var(--muted)}.late{color:var(--late)}.sm{font-size:12.5px}.b{font-weight:600}.r{text-align:right}
.tn{font-variant-numeric:tabular-nums}
#app{height:100%}
/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 10px;overflow:auto;gap:1px}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;padding:4px 10px 12px;color:#fff;line-height:1.15}
.brand small{display:block;font:500 11.5px 'Public Sans',sans-serif;color:var(--side-mut);margin-top:4px}
.ng{margin:14px 0 4px;padding:0 10px;font-size:12px;color:var(--side-mut)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;color:var(--side-ink);border-radius:5px;text-align:left}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:var(--side-act);color:#fff;font-weight:600}
.nav .bd{margin-left:auto;background:#E4B34A;color:#2b2200;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600}
.sp{flex:1}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:21px;margin-right:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--dc)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.who .role{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.25}
.who .role b{display:block;color:var(--ink);font-size:13.5px}
.main{flex:1;overflow:auto;padding:20px 24px 48px}
.sub{color:var(--muted);margin:2px 0 16px}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pine);color:var(--pine-ink);border-color:var(--pine);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--late);border-color:color-mix(in srgb,var(--late) 45%,var(--line))}
.btn.s{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--prog);text-decoration:underline;text-underline-offset:2px}
.in,.cell{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px;min-width:0}
.cell{border-color:transparent;background:transparent;padding:4px 6px;width:100%;border-radius:3px}
.cell:hover,.cell:focus{border-color:var(--line);background:var(--surface)}
.cell[disabled]{opacity:1;color:inherit;-webkit-text-fill-color:currentColor;cursor:default}
textarea.in{width:100%;resize:vertical;min-height:64px}
label.f{display:block;margin-bottom:12px;font-weight:500;font-size:13px}
label.f .in{display:block;width:100%;margin-top:4px;font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px}
.note{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--surface);border-radius:5px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.note.ok{border-left-color:var(--done)}.note.er{border-left-color:var(--late)}.note.in{border-left-color:var(--prog)}
/* chips & pills */
.dc{display:inline-block;padding:0 7px;border-radius:4px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--dc) 16%,var(--surface));border-left:3px solid var(--dc);line-height:1.6}
.st{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid currentColor;line-height:1.55;white-space:nowrap}
.st-todo{color:var(--todo)}.st-prog{color:var(--prog)}.st-done{color:var(--done)}.st-rev{color:#9A6B00}.st-fix{color:#B23A3A}
.pr{font-size:12px;font-weight:600}.pr-High{color:var(--late)}.pr-Medium{color:var(--warn)}.pr-Low{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tag .i{width:12px;height:12px}
.pb{display:inline-block;width:70px;height:6px;background:var(--line2);border-radius:3px;overflow:hidden;vertical-align:middle}
.pb i{display:block;height:100%;background:var(--prog)}
.pb.full i{background:var(--done)}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--mut2,#5B6862);color:#fff;font-size:10px;font-weight:600;margin-right:-5px;border:2px solid var(--surface)}
.av.team{border-radius:5px;background:#6B5B95}
.avs{display:inline-flex;padding-right:5px}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;min-width:1180px}
table.t th{position:sticky;top:0;background:var(--tint);text-align:left;font-weight:600;font-size:12.5px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:3px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.dept td{background:var(--tint);font-weight:600;padding:7px 8px}
table.t tr.par td{background:color-mix(in srgb,var(--ink) 2.5%,var(--surface))}
table.t tr.par .ttl{font-weight:600}
table.t tr.sub .ttl{padding-left:26px}
table.t tr:hover td{background:color-mix(in srgb,var(--prog) 5%,var(--surface))}
.no{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;min-width:32px;display:inline-block}
.ttl button{background:none;border:0;padding:0;text-align:left;font-weight:inherit}
.ttl button:hover{text-decoration:underline}
.xp{background:none;border:0;padding:0 4px 0 0;color:var(--muted)}
.xp .i{width:14px;height:14px;transition:transform .12s}.xp.open .i{transform:rotate(90deg)}
td .num{width:64px;text-align:right}
table.t select.cell{min-width:108px}
table.t input[type=date].cell{min-width:136px}
table.t td.ttl{min-width:300px}
.xp{display:inline-flex;align-items:center;vertical-align:middle}
td.n{white-space:nowrap}
/* home */
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.dt{width:100%;border-collapse:collapse}
.dt th{font-weight:500;color:var(--muted);text-align:left;font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line)}
.dt td{padding:9px 12px;border-bottom:1px solid var(--line2)}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr{cursor:pointer}.dt tbody tr:hover td{background:var(--tint)}
.grp{padding:10px 14px 4px;font-weight:600;font-size:13px;border-top:1px solid var(--line2)}
.grp:first-child{border-top:0}
.tk{display:flex;align-items:center;gap:10px;padding:8px 14px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line2)}
.tk:hover{background:var(--tint)}
.tk .tt{flex:1;min-width:0}.tk .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto}
.kc{background:var(--tint);border-radius:8px;padding:10px;min-height:220px;border:1px dashed transparent}
.kc.over{border-color:var(--prog);background:color-mix(in srgb,var(--prog) 8%,var(--tint))}
.kc h3{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 4px}
.kc h3 span{font-weight:400;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--dc);border-radius:6px;padding:9px 11px;margin-top:8px;cursor:pointer}
.card:hover{border-color:var(--muted);border-left-color:var(--dc)}
.card[draggable=true]{cursor:grab}
.card .cm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.card .cm .pr{margin-left:auto}
.card .ct{margin:5px 0 7px;font-weight:500}
.card .cp{display:flex;align-items:center;gap:8px;font-size:12.5px}
.card .cp .pb{flex:1;width:auto}
.card .cf{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px}
.card .cf .due{margin-left:auto}
.card .mv{margin-top:6px;font-size:12.5px;color:var(--muted)}
/* gantt */
.gw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.gr{display:flex;min-width:max-content}
.gl{position:sticky;left:0;z-index:2;width:300px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:6px;min-height:34px;border-bottom:1px solid var(--line2);overflow:hidden}
.gl button{background:none;border:0;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gl button:hover{text-decoration:underline}
.gl.gs{padding-left:30px}
.gr.h .gl{background:var(--tint);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line)}
.gt{position:relative;width:728px;flex:none;min-height:34px;border-bottom:1px solid var(--line2);background-image:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 26px);align-self:stretch}
.gt.wk::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 130px,var(--wk) 130px 182px)}
.gh{display:flex;width:728px;flex:none;background:var(--tint);border-bottom:1px solid var(--line)}
.gh div{width:26px;flex:none;text-align:center;font-size:11.5px;color:var(--muted);line-height:22px}
.gh div.we.on{background:var(--wk)}.gh div.td{color:var(--surface);background:var(--late);font-weight:600}
.gh.w div{width:182px;text-align:left;padding-left:6px;color:var(--ink);font-weight:600;border-left:1px solid var(--line)}
.gbar{position:absolute;top:8px;height:18px;border-radius:4px;background:color-mix(in srgb,var(--dc) 22%,var(--surface));border:1px solid var(--dc);overflow:hidden;font-size:11px;line-height:16px;padding-left:5px;cursor:pointer}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--dc);opacity:.85}
.gbar span{position:relative;color:var(--ink);font-weight:600;mix-blend-mode:normal;text-shadow:0 0 3px var(--surface)}
.gbar.gs{top:11px;height:12px;line-height:10px}.gbar.gs span{display:none}
.gbar.late{border-color:var(--late);box-shadow:0 0 0 1px var(--late)}
.tl{position:absolute;top:0;bottom:0;width:2px;background:var(--late);opacity:.7;z-index:1}
/* jadwal: daftar + timeline digabung */
.jw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.jr{display:flex;min-width:max-content}
.jl-wrap{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);flex:none}
.jl{display:grid;align-items:center;min-height:34px;border-bottom:1px solid var(--line2);padding:0 6px;gap:5px;font-size:12.5px}
.jl>div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.jl .ttl{white-space:normal;display:flex;align-items:center;gap:4px;font-weight:500}
.jl .cell{width:100%;min-width:0;font-size:12.5px;padding:4px 5px}
.jl.h{background:var(--tint);font-weight:600;border-bottom:1px solid var(--line)}
.jl.dept{display:block;background:var(--tint);font-weight:600;padding:7px 8px;grid-column:1/-1}
.jl.sub2{display:block;padding:0 8px;font-size:12.5px;color:var(--muted);background:var(--tint);white-space:nowrap;line-height:34px}
.jl .btn.s{padding:2px 6px}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid var(--line2)}
.dh .grow{flex:1;min-width:0}
.dh input.ti{font:600 18px 'Bricolage Grotesque',sans-serif;width:100%;border:1px solid transparent;background:transparent;padding:2px 4px;margin:4px 0 0 -4px;border-radius:4px}
.dh input.ti:hover,.dh input.ti:focus{border-color:var(--line);background:var(--surface)}
.db{flex:1;overflow:auto;padding:14px 18px 30px}
.db h4{margin:20px 0 8px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv label{font-size:12.5px;color:var(--muted);display:block}
.kv .in{display:block;width:100%;margin-top:3px;color:var(--ink)}
.pics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.permlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pc{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 8px;font-size:13px}
.pc button{border:0;background:none;padding:0 4px;color:var(--muted)}
.cmt{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.cmt small{color:var(--muted)}
.hist{font-size:13px;color:var(--muted);padding:3px 0;border-bottom:1px solid var(--line2)}
.stl{display:grid;grid-template-columns:28px minmax(0,1fr) 130px 100px 56px 108px;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line2)}
.stl .ttl{min-width:0}
.stl .ttl button{display:block;white-space:normal;word-break:break-word;text-align:left}
.stl .cell{width:100%;min-width:0}
.stl select.cell{font-size:12.5px}
.stl-act{display:flex;gap:3px;justify-content:flex-end;align-items:center}
.btn.s.b-todo{background:var(--todo);border-color:var(--todo);color:#fff}
.btn.s.b-todo:hover{filter:brightness(1.08)}
.btn.s.b-wip{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.s.b-wip:hover{filter:brightness(1.08)}
.b-done{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;color:#fff;background:var(--done);border-radius:6px;font-weight:700;font-size:13px}
.stl-act .btn{padding:2px 6px;line-height:1.4}
.pcs{display:inline-flex;align-items:center;gap:2px;background:var(--tint);border-radius:10px;padding:0 5px;margin-right:2px}
.pcs button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(540px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:31;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{margin-bottom:12px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.ov.m{z-index:30}
.acc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:none;padding:9px 4px}
.acc:hover{background:var(--tint)}
.cal{width:280px;margin:0 auto}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal .hd b{font-family:'Bricolage Grotesque',sans-serif;font-size:15px}
.cal .wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.cal .gd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .gd button{aspect-ratio:1;border:0;background:none;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer}
.cal .gd button:hover{background:var(--tint)}
.cal .gd button.today{box-shadow:inset 0 0 0 1px var(--prog)}
.cal .gd button.rng{background:color-mix(in srgb,var(--pine) 16%,var(--surface))}
.cal .gd button.sel{background:var(--pine);color:var(--pine-ink);font-weight:600}
.cal .gd span{aspect-ratio:1}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 24px));pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:6px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.warn{background:#8a5a0a;color:#fff}.toast.er{background:#9c2e21;color:#fff}
/* templates */
.tpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tp{padding:14px;display:flex;flex-direction:column;gap:8px}
.tp ol{margin:0;padding-left:20px;color:var(--muted);font-size:13px}
/* auth */
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100%}
.hero{background:var(--side);color:var(--side-ink);padding:44px 44px 30px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.hero h1{color:#fff;font-size:34px;line-height:1.1;max-width:15em}
.hero p{max-width:34em;color:var(--side-ink)}
.ledger{border:1px solid rgba(255,255,255,.16);border-radius:6px;max-width:460px;font-size:13.5px}
.ledger div{display:grid;grid-template-columns:34px 1fr auto 46px;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.09);align-items:center}
.ledger div:last-child{border:0}
.ledger b{font-family:'Bricolage Grotesque',sans-serif;color:#fff;font-variant-numeric:tabular-nums}
.ledger .c{font-size:11.5px;padding:0 6px;border-radius:3px;border-left:3px solid var(--dc);background:rgba(255,255,255,.07)}
.ledger em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:#fff}
.ledger .k{padding-left:34px;color:var(--side-mut)}
.formw{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--paper)}
.fbox{width:min(400px,100%)}
.fbox h1{margin-bottom:6px}
.gbtn{width:100%;justify-content:center;padding:9px 12px;font-weight:500}
.gbtn b{width:18px;height:18px;border-radius:50%;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0);color:transparent;display:inline-block}
.or{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:'';height:1px;background:var(--line);flex:1}
.err{color:var(--late);font-size:13px;min-height:18px;margin:2px 0 8px}
.links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.demo{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.demo .chips{margin-top:8px}
.otp{font:600 22px 'Bricolage Grotesque',sans-serif;letter-spacing:.3em;text-align:center}
/* report sheet */
.sheet{border:1px solid var(--line);border-radius:6px;overflow:auto;background:var(--surface)}
.sheet table{border-collapse:collapse;min-width:1100px;width:100%;font-size:12.5px}
.sheet th,.sheet td{border:1px solid var(--line2);padding:3px 7px;white-space:nowrap}
.sheet .col-l th{background:var(--tint);color:var(--muted);text-align:center;font-weight:400;font-size:11px}
.sheet .hd th{background:#1E6B47;color:#fff;font-weight:600;text-align:left;border-color:#18583a}
.sheet td:first-child,.sheet .col-l th:first-child{background:var(--tint);color:var(--muted);text-align:center;width:34px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{border-bottom-color:var(--pine);font-weight:600}
.sw{display:inline-flex;align-items:center;gap:8px}
.sw input{width:16px;height:16px}
.mtx select{min-width:96px}
.badge{display:inline-block;font-size:12px;padding:0 7px;border-radius:4px;background:var(--tint);border:1px solid var(--line)}
.badge.ex{border-color:var(--warn);color:var(--warn)}
.badge.off{border-color:var(--late);color:var(--late)}
/* android */
.andw{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
.phone{width:360px;height:720px;flex:none;border:10px solid #0b0f0d;border-radius:36px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph-top{padding:12px 16px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.ph-top h2{font-size:18px}
.ph-b{flex:1;overflow:auto;padding:8px 10px}
.ph-nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.ph-nav button{flex:1;border:0;background:none;padding:9px 0 7px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.ph-nav button.on{color:var(--pine);font-weight:600}
.pt{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--dc);border-radius:6px;padding:9px 10px;margin:6px 0}
.pt .ct{font-weight:500;margin:3px 0}
.pgh{font-weight:600;font-size:13px;margin:12px 4px 2px}
.banner{position:absolute;left:8px;right:8px;top:8px;background:#20262a;color:#fff;border-radius:12px;padding:10px 12px;z-index:5;font-size:13px;box-shadow:0 8px 22px rgba(0,0,0,.35);cursor:pointer}
.banner small{color:#aab;display:block}
.sheetb{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:4;display:flex;align-items:flex-end}
.sheetp{background:var(--surface);width:100%;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.seg button{flex:1;border:0;background:none;padding:6px 0;font-size:12.5px}
.seg button.on{background:var(--pine);color:var(--pine-ink);font-weight:600}
input[type=range]{width:100%}
@media (max-width:860px){
  .shell{display:flex;flex-direction:column}
  .side{flex-direction:row;overflow-x:auto;padding:8px;gap:4px;flex:none}
  .brand,.ng,.sp{display:none}
  .nav{width:auto;white-space:nowrap;padding:7px 10px}
  .top{padding:10px 14px}.main{padding:14px 14px 40px}
  .who{margin-left:0;width:100%;justify-content:space-between}
  .auth{grid-template-columns:1fr}.hero{padding:26px 22px}.hero h1{font-size:26px}
  .kv{grid-template-columns:1fr}
  .phone{width:100%;max-width:360px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    if(val==='Revisi')return stop('Status Revisi hanya terjadi otomatis kalau ada reviewer yang menolak.');
    if(val==='On Review'){
      if(t.parent)return stop('Sub task tidak melalui review. Selesaikan semua sub task, lalu ajukan review dari task induknya.');
      return submitReview({id:t.id});
    }
    let n=t.progress;
    if(val==='To do')n=0;else if(val==='Done')n=100;else if(n<=0||n>=100)n=50;
    const was=t.progress;t.progress=n;t.doneOn=val==='Done'?TODAY:null;t.status=val;
    if(val==='Done'&&old!=='Done')notifyNextUnlocked(t);
    afterChange(t,old,`Status ${old} → ${val} (progress ${fp(was)} → ${fp(n)})`);
  }else if(field==='start'||field==='end'){
    const s=field==='start'?val:t.start,e=field==='end'?val:t.end;
    if(!val)return stop('Tanggal tidak boleh kosong.');
    if(s&&e&&e<s)return stop('Tanggal End tidak boleh sebelum Start.');
    t[field]=val;if(t.parent)recalc(t.parent);hist(t,`${field==='start'?'Start':'End'} diubah ke ${fmt(val)}`);
  }else if(field==='title'){
    const v=String(val).trim();if(!v||v===t.title)return;hist(t,`Judul diubah dari "${t.title}"`);t.title=v;
  }else if(field==='remarks'){
    if(val===t.remarks)return;t.remarks=val;hist(t,'Remarks diperbarui');
  }else if(field==='prio'){
    if(t.parent)return;if(val===t.prio)return;hist(t,`Prioritas ${t.prio} → ${val}`);t.prio=val;
  }else if(field==='restricted'){
    if(!isMgr(me(),t.dept))return deny();t.restricted=!!val;hist(t,t.restricted?'Ditandai Terbatas':'Tanda Terbatas dicabut');
    logEv('task',t.restricted?'Tandai task terbatas':'Cabut tanda terbatas',`${t.dept}: ${t.title}`);
  }else if(field==='sequential'){
    t.sequential=!!val;hist(t,t.sequential?'Urutan wajib diaktifkan':'Urutan wajib dimatikan');
  }
  if(t.restricted)logEv('task','Ubah task terbatas',`${t.dept}: ${t.title}`);
  render();
}

function mineGroups(uid){
  const w1=addDays(mondayOf(TODAY),6);
  const direct=tasks.filter(t=>t.status!=='Done'&&picIds(t).includes(uid)&&canSee(t));
  const rootIds=[...new Set(direct.filter(t=>t.parent).map(t=>t.parent))];

  const mine=[...direct,...roots];
  const g={late:[],today:[],week:[],later:[]};
  mine.sort((a,b)=>(a.end||'9').localeCompare(b.end||'9')).forEach(t=>{const e=t.end||'9999';if(e<TODAY)g.late.push(t);else if(e===TODAY)g.today.push(t);else if(e<=w1)g.week.push(t);else g.later.push(t)});

}

function passF(t){
  const f=S.f,ks=kids(t.id),all=[t,...ks];
  if(S.project!=='Semua'&&projectOf(t)!==S.project)return false;
  if(f.pic&&!all.some(x=>picIds(x).includes(f.pic)))return false;
  if(f.prio&&t.prio!==f.prio)return false;
  if(f.due==='late'&&!lateFlag(t))return false;
  if(f.due==='week'&&!all.some(x=>x.end&&x.end>=TODAY&&x.end<=addDays(mondayOf(TODAY),6)&&x.status!=='Done'))return false;
  if((f.from||f.to)&&!all.some(x=>{
    if(!x.start&&!x.end)return false;
    const s=x.start||x.end,e=x.end||x.start;
    if(f.from&&e<f.from)return false;
    if(f.to&&s>f.to)return false;
    return true;
  }))return false;
  if(f.q&&!all.some(x=>x.title.toLowerCase().includes(f.q.toLowerCase())))return false;
  return true;
}

/* ---------- gantt ---------- */
function gantt(list){
  const W=26,N=28,s0=S.ganttStart;const rows=[];
  list.forEach(p=>{rows.push(p);if(!S.cg[p.id])kids(p.id).forEach(c=>rows.push(c))});
  const wk=[0,1,2,3].map(i=>`<div>${fmtS(addDays(s0,i*7))} – ${fmtS(addDays(s0,i*7+6))}</div>`).join('');
  const days=Array.from({length:N},(_,i)=>{const d=addDays(s0,i);const n=i%7;return `<div class="${n>=5?'we '+(S.wkColor?'on':''):''} ${d===TODAY?'td':''}" title="${fmt(d)}">${'SSRKJSM'[n]}</div>`}).join('');
  const tl=diff(s0,TODAY)>=0&&diff(s0,TODAY)<N?`<u class="tl" style="left:${(diff(s0,TODAY)+.5)*W}px"></u>`:'';
  let body='';
  rows.forEach(t=>{
    const sub=!!t.parent,a=Math.max(0,diff(s0,t.start||TODAY)),b=Math.min(N-1,diff(s0,t.end||TODAY)),out=diff(s0,t.end||TODAY)<0||diff(s0,t.start||TODAY)>N-1;
    const bar=out?'':`<div class="gbar ${sub?'gs':''} ${isLate(t)?'late':''}" style="left:${a*W+2}px;width:${(b-a+1)*W-4}px;--dc:${dcol(t.dept)}" data-a="open" data-id="${t.id}" title="${esc(t.title)}: ${fp(t.progress)}, ${fmtS(t.start)} – ${fmtS(t.end)}"><i style="width:${t.progress}%"></i><span>${fp(t.progress)}</span></div>`;
    body+=`<div class="gr"><div class="gl ${sub?'gs':''}"><span class="no">${NUM[t.id]}</span>${!sub&&kids(t.id).length?`<button class="xp ${S.cg[t.id]?'':'open'}" data-a="toggleG" data-id="${t.id}">${ic('chev')}</button>`:''}<button data-a="open" data-id="${t.id}" ${sub?'':'class="b"'}>${esc(t.title)}</button></div><div class="gt ${S.wkColor?'wk':''}">${bar}${tl}</div></div>`;
  });
  return `<div class="gw"><div class="gr h"><div class="gl">Task</div><div class="gh w">${wk}</div></div><div class="gr h"><div class="gl">Display week: ${fmtS(s0)} – ${fmtS(addDays(s0,N-1))}</div><div class="gh">${days}</div></div>${body||'<div class="empty">Tidak ada task.</div>'}</div>`;

/* ---------- import ---------- */
function matchPic(name){
  const n=name.trim().toLowerCase();
  const ex=users.find(u=>u.name.toLowerCase()===n);if(ex)return{uid:ex.id};
  if(/(\bteam|^tim\b)/i.test(name))return{team:name.trim()};
  const tok=n.replace(/\./g,'').split(/\s+/);
  const cand=users.filter(u=>u.active&&tok.some(x=>x.length>1&&u.name.toLowerCase().split(/\s+/).includes(x))).map(u=>u.id);
  return{cand:cand.length?cand:users.filter(u=>u.active).map(u=>u.id)};
}
const isAmb=s=>/^\d{2}\/\d{2}\/\d{4}$/.test(s||'')&&+s.slice(0,2)<=12&&+s.slice(3,5)<=12;
function parseD(s,f){
  if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return null;
  return f==='mdy'?`${m[3]}-${m[1]}-${m[2]}`:`${m[3]}-${m[2]}-${m[1]}`;
}
function impAnalyze(){
  const u=me(),I=S.imp;
  return IMPORT_ROWS.map((r,i)=>{
    const res=I.res[i]||{};let state='ok',fatal=null,probs=[];

    const upd=r.id?byId(r.id):null;
    if(!fatal&&r.id&&(!upd||!canEdit(upd)))fatal={label:'Ditolak',msg:'Task dengan ID ini tidak bisa kamu ubah'};

  });
}

function impDo(){
  const rows=impAnalyze().filter(r=>r.state==='ok'),map={};let np=0,ns=0,nu=0;
  const bid='B-'+pad(++bseq+1);const pics=new Set();
  const mkT=(r,parent)=>{
    const p=parent?byId(parent):null;
    const id=mk(r.dept,r.task,{parent,p:r.prog,pic:r.pic?[r.pic.uid||r.pic.team]:[],s:r.s,e:r.e,prio:r.prio||'Medium',r:r.remarks,by:S.me,batch:bid,upd:TODAY+' '+hhmm()});
    const t=byId(id);t.history.push({at:nowStr(),who:me().name,text:'Dibuat lewat import '+bid});
    if(r.pic&&r.pic.uid)pics.add(r.pic.uid);return id;
  };
  rows.filter(r=>!r.upd&&!r.no.includes('.')).forEach(r=>{map[r.dept+'|'+r.no]=mkT(r,null);np++});
  rows.filter(r=>!r.upd&&r.no.includes('.')).forEach(r=>{mkT(r,map[r.dept+'|'+r.no.split('.')[0]]);ns++});
  rows.filter(r=>r.upd).forEach(r=>{const t=r.upd;t.progress=r.prog;t.status=statusOf(r.prog);t.remarks=r.remarks||t.remarks;t.history.unshift({at:nowStr(),who:me().name,text:'Diperbarui lewat import '+bid});touch(t);nu++});
  tasks.filter(t=>!t.parent).forEach(t=>recalc(t.id));
  S.batches.unshift({id:bid,file:'task_september.xlsx',by:me().name,at:nowStr(),tasks:np,subs:ns,updated:nu,status:'Aktif'});
  logEv('import','Import selesai',`${np} task, ${ns} sub task, ${nu} diperbarui (${bid})`);
  notify('imp',null,`Import ${bid} selesai: ${np} task dan ${ns} sub task baru untukmu dan timmu`,[...pics]);
  S.notifs.unshift({id:'n'+(++nseq),uid:S.me,type:'imp',tid:null,text:`Import ${bid} selesai: ${np} task, ${ns} sub task`,at:'21 Sep, '+hhmm(),read:false});
  S.imp={stage:'done',res:{},dateFmt:null};
}

function repRows(){
  const ps=scoped().sort((a,b)=>DEPTS.findIndex(d=>d.id===a.dept)-DEPTS.findIndex(d=>d.id===b.dept)||a.ord-b.ord);
  const w0=mondayOf(TODAY),m0=TODAY.slice(0,8)+'01',m1=addDays(TODAY.slice(0,8)+'01',30);

  const nav=(id,l,i)=>`<button class="${A0.tab===id?'on':''}" data-a="andTab" data-t="${id}">${ic(i)}${l}${id==='notif'&&unread()?` (${unread()})`:''}</button>`;
  return `<div class="andw"><div class="phone" role="group" aria-label="Simulasi aplikasi Android">${banner}<div class="ph-top"><h2>${A0.tab==='task'?'Task saya':A0.tab==='notif'?'Kotak notifikasi':'Pengaturan'}</h2></div><div class="ph-b">${bodyH}</div>${sheet}<div class="ph-nav">${nav('task','Task saya','check')}${nav('notif','Notifikasi','bell')}${nav('set','Pengaturan','gear')}</div></div>
  <div style="flex:1;min-width:260px;max-width:460px"><h3>Fokus pada kerja harian</h3><p class="sub">Di HP: lihat task saya, ubah status dan progress, komentar, buka sub task, terima notifikasi. Import, kelola user, dan laporan tetap di dashboard.</p>

function androidSheet(t){
  const ch=kids(t.id),ed=canEdit(t),lock=lockedBy(t),auto=ch.length>0;
  return `<div class="sheetb"><div class="sheetp"><div class="row"><b class="grow">${NUM[t.id]} ${esc(t.title)}</b><button class="btn s" data-a="andClose">${ic('x')}</button></div><div class="sm mut">${dchip(t.dept)} ${esc(picNames(t))} · ${dueLabel(t)}</div>
  ${lock?`<div class="note" style="margin-top:8px">Terkunci sampai ${esc(lock)} selesai.</div>`:''}
  ${ed&&!auto&&!lock&&t.status!=='On Review'&&t.status!=='Revisi'?`<div class="seg">${STAT.map(s=>`<button class="${t.status===s?'on':''}" data-a="andStatus" data-id="${t.id}" data-s="${s}">${s}</button>`).join('')}</div><input type="range" min="0" max="100" step="5" value="${t.progress}" data-c="andProg" data-id="${t.id}" aria-label="Progress"><div class="sm tn r">${fp(t.progress)}</div>`:`<div class="row" style="margin:8px 0">${spill(t.status)}${pbar(t.progress)}<span class="sm">${fp(t.progress)}</span></div>${auto?'<div class="sm mut">Dihitung dari sub task.</div>':''}${t.status==='On Review'||t.status==='Revisi'?'<div class="sm mut">Sedang direview — lihat detail lengkap di dashboard.</div>':''}`}
  ${ch.length?`<h4 style="margin-top:10px">Sub task</h4>${ch.map(c=>{
    const cEd=canEdit(c)&&!lockedBy(c);
    const act=c.status==='To do'&&cEd?`<button class="btn s b-todo" data-a="startWork" data-id="${c.id}" aria-label="Kerjakan: ${esc(c.title)}">▶</button>`:c.status==='On Progress'&&cEd?`<button class="btn s b-wip" data-a="finishSub" data-id="${c.id}" aria-label="Selesai: ${esc(c.title)}">✓</button>`:c.status==='Done'?`<span class="b-done" title="Selesai">✓</span>`:`<span class="sm mut">${fp(c.progress)}</span>`;
    return `<div class="stl" style="grid-template-columns:28px 1fr 40px"><span class="no">${NUM[c.id]}</span><span class="ttl sm">${esc(c.title)}</span>${act}</div>`;
  }).join('')}`:''}
  ${t.remarks?`<h4 style="margin-top:10px">Remarks</h4><div class="sm">${esc(t.remarks)}</div>`:''}
  <h4 style="margin-top:10px">Komentar</h4>${t.comments.map(c=>`<div class="cmt sm"><b>${esc(uname(c.uid))}</b> <small>${c.at}</small><div>${esc(c.text)}</div></div>`).join('')||'<div class="sm mut">Belum ada komentar.</div>'}
  ${canComment(t)?`<div class="row" style="margin-top:8px"><input id="cm-in" class="in grow" placeholder="Tulis komentar" data-enter="comment" data-id="${t.id}"><button class="btn pri" data-a="comment" data-id="${t.id}">Kirim</button></div>`:''}</div></div>`;
}

/* ---------- drawer ---------- */

  <input class="ti" value="${esc(t.title)}" data-c="title" data-id="${t.id}" ${edLock?'':'disabled'} aria-label="Judul task">${sub?`<div class="sm mut">Sub task dari <button class="lnk" data-a="open" data-id="${par.id}">${NUM[par.id]} ${esc(par.title)}</button></div>`:''}</div><button class="btn" data-a="close" aria-label="Tutup">${ic('x')}</button></div>
  <div class="db">${!ed&&!edp?`<div class="note in">Kamu hanya bisa melihat task ini (${u.roles[t.dept]==='Viewer'?'role Viewer':'bukan PIC atau pembuatnya'}).</div>`:''}${edp?'<div class="note in">Kamu diberi akses khusus untuk mengubah progress dan status task ini saja.</div>':''}${lock?`<div class="note">${ic('lock')} Terkunci: selesaikan <b>${esc(lock)}</b> lebih dulu (urutan wajib).</div>`:''}${auto?'<div class="note in">Progress, status, dan tanggal dihitung otomatis dari sub task.</div>':''}
  ${!sub&&!edLock?`<div class="note in">Judul, deadline, prioritas, dan departemen terkunci untuk PIC — hanya PMO yang bisa mengubahnya.</div>`:''}
  ${t.status==='Revisi'?`<div class="note er"><b>${ic('x')} Perlu direvisi.</b> Ada reviewer yang menolak — lihat catatan di bawah, lalu ajukan ulang setelah diperbaiki.
  ${ed?`<div class="row" style="margin-top:8px"><button class="btn s pri" data-a="submitReview" data-id="${t.id}">Ajukan ulang untuk Review</button></div>`:''}</div>`:''}
  ${(t.status==='On Review'||t.status==='Revisi'||(t.status==='Done'&&!t.closeVia))&&reviewersOf(t).length?`<div class="note"><b>Reviewer (${reviewProgress(t)} sudah menilai)</b>
  <div style="margin-top:6px;display:grid;gap:4px">${reviewersOf(t).map(r=>`<div class="sm">${esc(uname(r.uid))} — ${r.decision==='accept'?'<span style="color:var(--done)">Accept</span>':r.decision==='reject'?'<span style="color:var(--late)">Reject</span>'+(r.note?': '+esc(r.note):''):'<span class="mut">belum menilai</span>'}</div>`).join('')}</div>
  ${myPending&&t.status==='On Review'?`<div class="row" style="margin-top:8px"><button class="btn s pri" data-a="reviewDecideOpen" data-id="${t.id}" data-dec="accept">Accept</button><button class="btn s dng" data-a="reviewDecideOpen" data-id="${t.id}" data-dec="reject">Reject</button></div>`:''}

  <p class="sm mut">Dibuat oleh ${esc(uname(t.by))}</p>

  ${!sub?`<h4>Reviewer</h4><div class="pics">${reviewersOf(t).length?reviewersOf(t).map(r=>`<span class="pc">${avatar({uid:r.uid})}<span style="margin-left:4px">${esc(uname(r.uid))}${r.decision?' · '+(r.decision==='accept'?'Accept':'Reject'):''}</span></span>`).join(''):'<span class="mut sm">Tidak ada reviewer — langsung ke antrian PMO setelah diajukan.</span>'}</div>`:''}

      return `<div class="stl"><span class="no">${NUM[c.id]}</span><span class="ttl"><span title="Sub task milik orang lain, hanya tampil ringkas">${ic('lock')} ${esc(c.title)}</span></span><span class="sm">${esc(picNames(c))}</span><span>${spill(c.status)}</span><span></span><span></span></div>`;

    ${!par?`<label class="f">Sub task (opsional)<textarea id="nt-subs" class="in" rows="3" placeholder="Satu sub task per baris, contoh:
Pengajuan form
Pengadaan barang
Pemasangan">${esc(m.subs||'')}</textarea></label><p class="sm mut">Satu baris = satu sub task. Ketik lalu Enter untuk baris baru, atau tempel beberapa baris sekaligus dari catatanmu. PIC dan tanggal diwariskan dari task ini dan bisa diubah lagi nanti per sub task.</p>`:''}

  }else if(m.type==='reviewReject'){
    const t=byId(m.id);
    inner=`<h2>Tolak (Reject)</h2><p class="sub">${esc(t.title)}</p><label class="f">Catatan alasan (wajib diisi)<textarea id="rj-note-${t.id}" class="in" rows="3" placeholder="Jelaskan apa yang perlu diperbaiki…"></textarea></label><div class="err" id="rj-err"></div><div class="acts"><button class="btn" data-a="mclose">Batal</button><button class="btn pri dng" data-a="reviewDecide" data-id="${t.id}" data-dec="reject">Tolak task ini</button></div>`;
  }else if(m.type==='editProject'){
    const pr=S.projects.find(x=>x.id===m.id);
    inner=`<h2>Edit Project</h2><label class="f">Nama<input id="pe-name" class="in" value="${esc(pr.name)}"></label><label class="f">Kode<input id="pe-code" class="in" value="${esc(pr.code)}" maxlength="6" style="text-transform:uppercase"></label><p class="sm mut">Mengubah kode akan mengubah nomor semua task di project ini (mis. dari OPS-1 jadi kode baru).</p><div class="err" id="pe-err"></div><div class="acts"><button class="btn" data-a="mclose">Batal</button><button class="btn pri" data-a="projEditSave" data-id="${pr.id}">Simpan</button></div>`;
  }else if(m.type==='editRoles'){
    const eu=users.find(x=>x.id===m.id);
    inner=`<h2>Role &amp; Akses</h2><p class="sub">${esc(eu.name)} · ${esc(eu.email)}</p>
    <h4 style="margin-top:4px">Hak akses global</h4>
    <div style="display:grid;gap:10px;margin-bottom:14px">
    <label class="sw" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="re-admin" style="margin-top:3px" ${eu.admin?'checked':''}><span><b>Administrator</b><br><span class="sm mut">Akses penuh ke semua departemen, semua task, dan pengaturan sistem.</span></span></label>
    <label class="sw" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="re-pmo" style="margin-top:3px" ${eu.pmo?'checked':''}><span><b>PMO</b><br><span class="sm mut">Lihat dan CRUD semua task di semua departemen. Bisa membuat task, mengalihkan PIC, dan closing.</span></span></label>
    <label class="sw" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="re-direktur" style="margin-top:3px" ${eu.direktur?'checked':''}><span><b>Direktur</b><br><span class="sm mut">Lihat semua departemen dan bisa membuat task untuk siapa saja. Tidak ikut CRUD penuh seperti PMO/Administrator.</span></span></label>
    </div>

    <div class="kv">${DEPTS.map(d=>`<label>${d.id}<select class="in" id="re-role-${d.id}">${options([['','—'],...ROLES],eu.roles[d.id]||'')}</select></label>`).join('')}</div>

    <div class="err" id="re-err"></div>
    <div class="acts"><button class="btn" data-a="mclose">Batal</button><button class="btn pri" data-a="rolesEditSave" data-id="${eu.id}">Simpan</button></div>`;
  }
  return `<div class="ov m" data-a="mclose"></div><div class="modal" role="dialog" aria-modal="true">${inner}</div>`;
}

/* ================= render ================= */
function render(){
  const act=document.activeElement,fid=act&&act.id,ss=act&&act.selectionStart,se=act&&act.selectionEnd;
  const sels=['.main','.db','.gw','.ph-b','.tw','.kb'],sv=[];
  sels.forEach(s=>document.querySelectorAll(s).forEach((el,i)=>sv.push([s,i,el.scrollTop,el.scrollLeft])));
  NUM=buildNum();
  $('#app').innerHTML=S.screen==='app'?shell():authScreen();
  sv.forEach(([s,i,t,l])=>{const el=document.querySelectorAll(s)[i];if(el){el.scrollTop=t;el.scrollLeft=l}});
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{el.setSelectionRange(ss,se)}catch(e){}}}
}
const go=r=>{S.route=r;S.openId=null;S.modal=null;render();const m=$('#main');if(m)m.scrollTop=0};

/* ================= actions ================= */
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const A={
  gopen(){S.modal={type:'gchoose'};render()},
  dateFilterOpen(){S.modal={type:'daterange',month:ymOf(S.f.from),from:S.f.from,to:S.f.to};render()},
  drPrev(){S.modal.month=addMonths(S.modal.month,-1);render()},
  drNext(){S.modal.month=addMonths(S.modal.month,1);render()},
  drPick(d){
    const m=S.modal,day=d.d;
    if(!m.from||m.to){m.from=day;m.to='';}
    else if(day<m.from){m.to=m.from;m.from=day;}
    else{m.to=day;}
    render();
  },
  drClearAll(){S.modal.from='';S.modal.to='';render()},
  drApply(){
    S.f.from=S.modal.from;S.f.to=S.modal.to;
    if(S.f.from)S.ganttStart=mondayOf(S.f.from);
    S.modal=null;render();
  },
  gpick(d){S.modal=null;loginAs(d.id)},
  mclose(){S.modal=null;render()},
  login(){
    const em=val('l-email').trim().toLowerCase(),pw=val('l-pass');
    if(!em){S.err='Isi email dulu.';return render()}
    if(S.fails>=5){S.err='Terlalu banyak percobaan. Coba lagi dalam 15 menit. (Batas percobaan login aktif.)';return render()}
    const u=users.find(x=>x.email===em||x.extra.includes(em));
    if(!u){
      if(S.pending.some(p=>p.email===em)){S.waitEmail=em;S.screen='waiting';return render()}
      S.err='Email ini belum diundang. Minta undangan atau ajukan akses.';return render();
    }
    if(pw.length<10){S.fails++;S.err='Password minimal 10 karakter.'+(S.fails>=3?` (${5-S.fails} percobaan tersisa)`:'');return render()}
    S.fails=0;loginAs(u.id);
  },
  demo(d){loginAs(d.id)},
  forgot(){toast('Tautan reset password dikirim ke email (simulasi).')},
  toRequest(){S.screen='request';S.err='';render()},
  toLogin(){S.screen='login';S.err='';S.modal=null;S.inv=null;render()},
  twofa(){if(!/^\d{6}$/.test(val('tf').trim())){S.err='Kode harus 6 digit.';return render()}enter(S.tmp)},
  twofaFill(){document.getElementById('tf').value='482913'},
  request(){
    const n=val('r-name').trim(),e=val('r-email').trim().toLowerCase();
    if(!n||!/^\S+@\S+\.\S+$/.test(e)){S.err='Isi nama dan email yang valid.';return render()}
    if(users.some(u=>u.email===e)){S.err='Email ini sudah punya akun. Silakan masuk.';return render()}
    if(!S.pending.some(p=>p.email===e))S.pending.push({id:'p'+(++useq),name:n,email:e,at:nowStr()});
    logEv('akses','Permintaan akses',e,n);S.waitEmail=e;S.screen='waiting';render();
  },
  openInvite(d){S.inv={id:d.id,step:1};S.screen='invite';S.err='';S.modal=null;render()},
  invGoogle(){S.inv.mode='google';A.invFinish()},
  invPass(){S.inv.step=2;S.err='';render()},
  invPass2(){const a=val('iv-p1'),b=val('iv-p2');if(a.length<10){S.err='Password minimal 10 karakter.';return render()}if(a!==b){S.err='Kedua password harus sama.';return render()}S.inv.mode='pass';S.inv.step=3;S.err='';render()},
  invFill(){document.getElementById('iv-code').value='739204'},
  invVerify(){if(!/^\d{6}$/.test(val('iv-code').trim())){S.err='Kode harus 6 digit.';return render()}A.invFinish()},
  invFinish(){
    const iv=S.invites.find(i=>i.id===S.inv.id);iv.status='Diterima';
    const nm=iv.email.split('@')[0].split(/[._]/).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
    const u=mkU('u'+(++useq),nm,iv.email,{admin:iv.role==='Administrator',roles:iv.role==='Administrator'?{}:{[iv.dept]:iv.role},via:S.inv.mode==='google'?'Google':'Email'});
    if(isExt(u))u.expires=addDays(TODAY,S.set.expiry*30);
    users.push(u);logEv('undangan','Undangan diterima',`${iv.email} sebagai ${iv.role}${iv.role==='Administrator'?'':' '+iv.dept}`,u.name);
    S.inv=null;toast('Email terverifikasi. Akunmu aktif.');enter(u.id);
  },
  logout(){S.me=null;S.screen='login';S.openId=null;S.modal=null;render()},
  go(d){go(d.r)},
  setDept(d){S.dept=d.d;render()},
  filterDept(d){S.dept=d.d;if(d.r)S.route=d.r;render()},
  open(d){S.openId=d.id;S.delArm=null;render()},
  close(){S.openId=null;S.delArm=null;render()},
  toggle(d){S.collapsed[d.id]=!S.collapsed[d.id];render()},
  toggleG(d){S.cg[d.id]=!S.cg[d.id];render()},
  gPrev(){S.ganttStart=addDays(S.ganttStart,-7);render()},gNext(){S.ganttStart=addDays(S.ganttStart,7);render()},gToday(){S.ganttStart=mondayOf(TODAY);render()},
  fclear(){S.f.from='';S.f.to='';render()},
  newTask(){if(!canCreateSelfTask())return deny();S.modal={type:'newTask',dept:S.dept!=='Semua'&&myDepts().some(d=>d.id===S.dept)?S.dept:(myDepts()[0]?myDepts()[0].id:DEPTS[0].id),reviewers:[]};render()},
  newSub(d){S.modal={type:'newTask',parent:d.id};render()},
  ntRevAdd(){
    captureNewTaskForm();
    const cand=users.filter(x=>x.active&&x.id!==S.me);
    const r=resolvePicInput('nt-rev-f',cand);
    if(!r||!r.uid)return toast('Pilih reviewer yang terdaftar dari daftar saran.','warn');
    S.modal.reviewers=S.modal.reviewers||[];
    if(!S.modal.reviewers.includes(r.uid))S.modal.reviewers.push(r.uid);
    render();
  },
  ntRevDel(d){captureNewTaskForm();S.modal.reviewers.splice(+d.i,1);render()},
  ntSave(){
    const u0=me(),par=S.modal.parent?byId(S.modal.parent):null,selfOnly=!par&&selfOnlyCreate(u0);
    const title=val('nt-title').trim(),dept=par?par.dept:val('nt-dept'),s=val('nt-s'),e=val('nt-e');
    const cand=users.filter(x=>x.active&&(x.admin||x.roles[dept]));
    const pv=selfOnly?u0.id:(()=>{const pr=resolvePicInput('nt-pic-f',cand);return pr?(pr.uid||pr.team):''})();
    const reviewers=(S.modal.reviewers||[]).slice();
    const er=m=>{document.getElementById('nt-err').textContent=m};
    if(!title)return er('Judul wajib diisi.');if(!s||!e)return er('Start dan End wajib diisi.');if(e<s)return er('End tidak boleh sebelum Start.');
    if(!pv)return er('PIC wajib diisi.');
    if(!par&&!canCreateTask()&&!(selfOnly&&myDepts().some(d=>d.id===dept)))return deny();
    const resEl=document.getElementById('nt-res');
    const t=newTask({dept,title,parent:par?par.id:null,pic:[pv].filter(Boolean),start:s,end:e,prio:val('nt-prio'),res:resEl?resEl.checked:false,reviewers});
    logEv('task','Membuat '+(par?'sub task':'task'),`${dept}: ${title}`);
    const subsEl=document.getElementById('nt-subs');
    let nSubs=0;
    if(subsEl){
      const lines=subsEl.value.split('\n').map(x=>x.trim()).filter(Boolean);
      let cur=s;
      lines.forEach(v=>{newTask({dept,title:v,parent:t.id,pic:[pv].filter(Boolean),start:cur,end:addDays(cur,3)});cur=addDays(cur,3);nSubs++});
      if(nSubs)logEv('task','Menambah sub task sekaligus',`${dept}: ${title} — ${nSubs} sub task`);
    }
    S.modal=null;toast('Task dibuat dengan nomor '+(buildNum()[t.id]||'—')+' (otomatis).'+(nSubs?' '+nSubs+' sub task ikut dibuat.':''));
    if(par)S.openId=par.id;render();
  },
  useTpl(d){S.modal={type:'tpl',id:d.id};render()},
  tplGo(d){
    const tp=TEMPLATES.find(x=>x.id===d.id),s=val('tp-s')||TODAY;
    const cand=users.filter(x=>x.active&&(x.admin||x.roles[tp.dept]));
    const pr=resolvePicInput('tp-pic-f',cand),pic=pr?(pr.uid||pr.team):'';
    const total=tp.subs.reduce((a,x)=>a+x[1],0);
    const p=newTask({dept:tp.dept,title:tp.name,pic:pic?[pic]:[],start:s,end:addDays(s,total-1),prio:tp.prio,res:tp.dept==='Legal'&&S.set.legalRestricted,seq:tp.seq});
    let cur=s;tp.subs.forEach(([n,dur])=>{newTask({dept:tp.dept,title:n,parent:p.id,pic:pic?[pic]:[],start:cur,end:addDays(cur,dur-1)});cur=addDays(cur,dur)});
    logEv('task','Membuat task dari template',`${tp.dept}: ${tp.name}`);S.modal=null;S.route='jadwal';S.dept=tp.dept;S.openId=p.id;toast('Task dan '+tp.subs.length+' sub task dibuat dari template.');render();
  },
  comment(d){const t=byId(d.id),v=val('cm-in').trim();if(!v)return;if(!canComment(t))return deny();t.comments.push({uid:S.me,text:v,at:'21 Sep, '+hhmm()});hist(t,'Menambah komentar');notify('status',t,`${me().name} berkomentar di "${t.title}"`,[...picIds(t),...mgrIds(t.dept)]);render()},
  picAdd(d){
    const t=byId(d.id);if(!(t.parent?canEdit(t):isPMO()))return deny();
    const picOpts=users.filter(x=>x.active&&(x.admin||x.roles[t.dept])&&!picIds(t).includes(x.id));
    const r=resolvePicInput('pic-add-'+t.id,picOpts);
    if(!r)return toast('Pilih orang atau isi nama tim.','warn');

document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(!c||!dragId)return;e.preventDefault();const id=dragId;dragId=null;applyField(id,'status',c.dataset.col)});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.kc.over').forEach(x=>x.classList.remove('over'))});
render();
})();
</script>
</body>
</html>
