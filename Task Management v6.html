<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Management — Prototipe klik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EC;--surface:#FBFCFB;--ink:#17211D;--muted:#5B6862;--line:#CFD7D1;--line2:#E4E9E5;
  --pine:#1E4D40;--pine-ink:#F2F7F4;--side:#14302A;--side-ink:#D5E3DC;--side-mut:#8FA69C;--side-act:#22493F;
  --todo:#7C8A93;--prog:#3468D6;--done:#2C9A68;--late:#C23B2B;--wk:rgba(23,33,29,.05);--focus:#3468D6;--warn:#B7791F;
  --tint:color-mix(in srgb,var(--ink) 4%,var(--paper));
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0F1512;--surface:#171F1B;--ink:#E6ECE8;--muted:#9AA8A1;--line:#2C3832;--line2:#232D28;--pine:#5FB79E;--pine-ink:#0C1613;--wk:rgba(255,255,255,.05);--todo:#93A0A8;--prog:#7AA0F2;--done:#4CBE8A;--late:#EE7565;--focus:#7AA0F2;--warn:#E0A94A}
}
:root[data-theme="dark"]{--paper:#0F1512;--surface:#171F1B;--ink:#E6ECE8;--muted:#9AA8A1;--line:#2C3832;--line2:#232D28;--pine:#5FB79E;--pine-ink:#0C1613;--wk:rgba(255,255,255,.05);--todo:#93A0A8;--prog:#7AA0F2;--done:#4CBE8A;--late:#EE7565;--focus:#7AA0F2;--warn:#E0A94A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15px}h4{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
p{margin:0}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mut{color:var(--muted)}.late{color:var(--late)}.sm{font-size:12.5px}.b{font-weight:600}.r{text-align:right}
.tn{font-variant-numeric:tabular-nums}
#app{height:100%}
/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 10px;overflow:auto;gap:1px}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;padding:4px 10px 12px;color:#fff;line-height:1.15}
.brand small{display:block;font:500 11.5px 'Public Sans',sans-serif;color:var(--side-mut);margin-top:4px}
.ng{margin:14px 0 4px;padding:0 10px;font-size:12px;color:var(--side-mut)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;color:var(--side-ink);border-radius:5px;text-align:left}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:var(--side-act);color:#fff;font-weight:600}
.nav .bd{margin-left:auto;background:#E4B34A;color:#2b2200;border-radius:9px;font-size:11px;padding:0 6px;font-weight:600}
.sp{flex:1}
.col{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:21px;margin-right:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--dc)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.who .role{font-size:12.5px;color:var(--muted);text-align:right;line-height:1.25}
.who .role b{display:block;color:var(--ink);font-size:13.5px}
.main{flex:1;overflow:auto;padding:20px 24px 48px}
.sub{color:var(--muted);margin:2px 0 16px}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pine);color:var(--pine-ink);border-color:var(--pine);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--late);border-color:color-mix(in srgb,var(--late) 45%,var(--line))}
.btn.s{padding:3px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--prog);text-decoration:underline;text-underline-offset:2px}
.in,.cell{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px;min-width:0}
.cell{border-color:transparent;background:transparent;padding:4px 6px;width:100%;border-radius:3px}
.cell:hover,.cell:focus{border-color:var(--line);background:var(--surface)}
.cell[disabled]{opacity:1;color:inherit;-webkit-text-fill-color:currentColor;cursor:default}
textarea.in{width:100%;resize:vertical;min-height:64px}
label.f{display:block;margin-bottom:12px;font-weight:500;font-size:13px}
label.f .in{display:block;width:100%;margin-top:4px;font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px}
.note{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--surface);border-radius:5px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.note.ok{border-left-color:var(--done)}.note.er{border-left-color:var(--late)}.note.in{border-left-color:var(--prog)}
/* chips & pills */
.dc{display:inline-block;padding:0 7px;border-radius:4px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--dc) 16%,var(--surface));border-left:3px solid var(--dc);line-height:1.6}
.st{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid currentColor;line-height:1.55;white-space:nowrap}
.st-todo{color:var(--todo)}.st-prog{color:var(--prog)}.st-done{color:var(--done)}.st-rev{color:#9A6B00}.st-fix{color:#B23A3A}
.pr{font-size:12px;font-weight:600}.pr-High{color:var(--late)}.pr-Medium{color:var(--warn)}.pr-Low{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tag .i{width:12px;height:12px}
.pb{display:inline-block;width:70px;height:6px;background:var(--line2);border-radius:3px;overflow:hidden;vertical-align:middle}
.pb i{display:block;height:100%;background:var(--prog)}
.pb.full i{background:var(--done)}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--mut2,#5B6862);color:#fff;font-size:10px;font-weight:600;margin-right:-5px;border:2px solid var(--surface)}
.av.team{border-radius:5px;background:#6B5B95}
.avs{display:inline-flex;padding-right:5px}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;min-width:1180px}
table.t th{position:sticky;top:0;background:var(--tint);text-align:left;font-weight:600;font-size:12.5px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:3px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.dept td{background:var(--tint);font-weight:600;padding:7px 8px}
table.t tr.par td{background:color-mix(in srgb,var(--ink) 2.5%,var(--surface))}
table.t tr.par .ttl{font-weight:600}
table.t tr.sub .ttl{padding-left:26px}
table.t tr:hover td{background:color-mix(in srgb,var(--prog) 5%,var(--surface))}
.no{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-variant-numeric:tabular-nums;min-width:32px;display:inline-block}
.ttl button{background:none;border:0;padding:0;text-align:left;font-weight:inherit}
.ttl button:hover{text-decoration:underline}
.xp{background:none;border:0;padding:0 4px 0 0;color:var(--muted)}
.xp .i{width:14px;height:14px;transition:transform .12s}.xp.open .i{transform:rotate(90deg)}
td .num{width:64px;text-align:right}
table.t select.cell{min-width:108px}
table.t input[type=date].cell{min-width:136px}
table.t td.ttl{min-width:300px}
.xp{display:inline-flex;align-items:center;vertical-align:middle}
td.n{white-space:nowrap}
/* home */
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.dt{width:100%;border-collapse:collapse}
.dt th{font-weight:500;color:var(--muted);text-align:left;font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line)}
.dt td{padding:9px 12px;border-bottom:1px solid var(--line2)}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr{cursor:pointer}.dt tbody tr:hover td{background:var(--tint)}
.grp{padding:10px 14px 4px;font-weight:600;font-size:13px;border-top:1px solid var(--line2)}
.grp:first-child{border-top:0}
.tk{display:flex;align-items:center;gap:10px;padding:8px 14px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line2)}
.more{position:relative}.more summary{list-style:none;cursor:pointer}.more summary::-webkit-details-marker{display:none}.more .menu{position:absolute;right:0;top:100%;margin-top:4px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;gap:4px;min-width:150px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.nrow{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.nrow.unread{background:color-mix(in srgb,var(--prog) 6%,transparent)}
.ngh{padding:8px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.nic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line2);color:var(--muted)}
.nic svg{width:15px;height:15px}
.nic.review{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.nic.closing{background:color-mix(in srgb,var(--done) 22%,transparent);color:var(--done)}
.nic.akses{background:color-mix(in srgb,var(--prog) 22%,transparent);color:var(--prog)}
.dot{width:8px;height:8px;border-radius:50%;background:transparent;flex:none;margin-top:6px}
.dot.on{background:var(--prog)}
.pf-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.pf-av{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:22px;flex:none;overflow:hidden}
.pf-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pf-cam{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.pf-cam svg{width:12px;height:12px}
.pf-stats{gap:20px}
.pf-stat{display:flex;flex-direction:column;align-items:center;min-width:56px}
.pf-stat b{font-size:20px;font-family:'Bricolage Grotesque',sans-serif}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab2{padding:8px 14px;border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab2.on{color:var(--ink);border-bottom-color:var(--pine,var(--focus))}
.pf-meter{display:flex;gap:4px;margin-top:6px}
.pf-meter i{flex:1;height:4px;border-radius:2px;background:var(--line2);display:block}
.pf-meter i.on1{background:var(--late)}.pf-meter i.on2{background:var(--warn)}.pf-meter i.on3{background:var(--prog)}.pf-meter i.on4{background:var(--done)}
/* Planning */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.plan-h{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 8px;min-height:56px;flex-wrap:wrap}
.plan-tg{width:36px;height:36px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.plan-tg svg{width:18px;height:18px;transition:transform .15s}.plan-tg[aria-expanded=true] svg{transform:rotate(90deg)}
.plan-m{flex:1;min-width:240px}
.plan-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.plan-meta svg{width:13px;height:13px;vertical-align:-2px}
.pst{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pst.draft{background:var(--line2);color:var(--muted)}.pst.dikaji{background:color-mix(in srgb,var(--prog) 18%,transparent);color:var(--prog)}.pst.disetujui{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done)}.pst.berjalan{background:var(--pine);color:#fff}.pst.ditunda{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.plan-b{border-top:1px solid var(--line2);background:var(--paper);padding:6px 16px 12px 52px}
.ptr{display:flex;align-items:center;gap:12px;min-height:40px;border-bottom:1px solid var(--line2);font-size:13.5px;flex-wrap:wrap}
.ptr .pl-n{font-size:12px;font-weight:600;color:var(--muted);width:52px}.ptr .pl-t{flex:1;min-width:180px}.ptr .pl-p,.ptr .pl-d{width:150px;font-size:12px;color:var(--muted)}.ptr svg{width:13px;height:13px;vertical-align:-2px}
.in.bad{border-color:var(--late);background:color-mix(in srgb,var(--late) 6%,transparent)}
/* Aturan layer & CC (Purchase Request) */
.rule{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.rule.hit{border-color:var(--pine);box-shadow:0 0 0 3px color-mix(in srgb,var(--pine) 15%,transparent)}
.rh{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--paper);flex-wrap:wrap}
.rn{width:24px;height:24px;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.rh .t{flex:1;min-width:180px}
.range{font-size:12.5px;color:var(--muted)}
.range strong{color:var(--ink);font-weight:600}
.lvl{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.l1{background:color-mix(in srgb,var(--pine) 18%,transparent);color:var(--pine)}.l2{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}.l3{background:color-mix(in srgb,var(--late) 18%,transparent);color:var(--late)}
.match{font-size:11px;font-weight:700;color:var(--pine);display:none}
.rule.hit .match{display:inline}
.rb{padding:14px 16px;display:grid;grid-template-columns:1fr 260px;gap:18px}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--surface)}
.pill small{color:var(--muted);font-size:11px}
.pill .av{width:22px;height:22px;font-size:9px}
.pill.dyn{border-style:dashed}
.pill.dyn .av{background:var(--paper);color:var(--muted);border:1px dashed var(--line)}
.arrow{color:var(--muted);font-size:13px}
.cc-box{border-left:1px dashed var(--line);padding-left:18px}
.cc-box .pill{margin:0 4px 6px 0}
.cc-note{font-size:12px;color:var(--muted);margin-top:4px}
.add-rule button{width:100%;height:42px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-weight:500;cursor:pointer}
.add-rule button:hover{color:var(--pine);border-color:var(--pine)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 4px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-block}
.lg.d{border-style:dashed;background:var(--paper)}
.t-ga{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.t-cc{background:color-mix(in srgb,var(--prog) 20%,transparent);color:var(--prog);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.sim{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.money{position:relative}.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.money input{padding-left:34px}
.flow{display:flex;align-items:flex-start;overflow-x:auto;padding:4px 0}
.st{flex:1;min-width:110px;text-align:center;position:relative;padding:0 4px}
.st:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 20px);right:calc(-50% + 20px);height:2px;background:var(--line)}
.st .av{width:34px;height:34px;font-size:11px;margin:0 auto;position:relative;z-index:1;border:3px solid var(--surface)}
.st .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:6px}
.st .w{font-size:12.5px;font-weight:600}
.st .r{font-size:11.5px;color:var(--muted)}
.res-cc{margin-top:14px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--prog) 12%,transparent);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res-cc .avs{display:flex}.res-cc .avs .av{width:24px;height:24px;font-size:9px;border:2px solid var(--surface);margin-left:-6px}.res-cc .avs .av:first-child{margin-left:0}
.res-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.tk:hover{background:var(--tint)}
.tk .tt{flex:1;min-width:0}.tk .tt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto}
.kc{background:var(--tint);border-radius:8px;padding:10px;min-height:220px;border:1px dashed transparent}
.kc.over{border-color:var(--prog);background:color-mix(in srgb,var(--prog) 8%,var(--tint))}
.kc h3{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 4px}
.kc h3 span{font-weight:400;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--dc);border-radius:6px;padding:9px 11px;margin-top:8px;cursor:pointer}
.card:hover{border-color:var(--muted);border-left-color:var(--dc)}
.card[draggable=true]{cursor:grab}
.card .cm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.card .cm .pr{margin-left:auto}
.card .ct{margin:5px 0 7px;font-weight:500}
.card .cp{display:flex;align-items:center;gap:8px;font-size:12.5px}
.card .cp .pb{flex:1;width:auto}
.card .cf{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px}
.card .cf .due{margin-left:auto}
.card .mv{margin-top:6px;font-size:12.5px;color:var(--muted)}
/* gantt */

function recalc(pid,quiet){
  const p=byId(pid);if(!p)return;const ch=kids(pid);if(!ch.length)return;
  let pr;
  if(S.set.weighted){
    const w=ch.map(c=>Math.max(1,diff(c.start,c.end)+1));
    const doneW=ch.reduce((a,c,i)=>a+(c.status==='Done'?w[i]:0),0);
    pr=doneW/w.reduce((a,b)=>a+b,0)*100;
  }else{
    const done=ch.filter(c=>c.status==='Done').length;
    pr=done/ch.length*100;
  }
  p.progress=Math.round(pr*100)/100;
  if(!['On Review','Revisi','Done'].includes(p.status)){
    p.status=pr<=0?'To do':'On Progress';
  }
  p.doneOn=null;
  p.start=ch.map(c=>c.start).filter(Boolean).sort()[0]||p.start;
  p.end=ch.map(c=>c.end).filter(Boolean).sort().pop()||p.end;
}

function doPRLayerDecide(d){

  prHist(pr,`${u.name} (layer ${idx+1}/${layers.length}) ${d.dec==='accept'?'menyetujui':'menolak ('+(target==='vendor'?'perbandingan vendor':'isi pengajuan')+')'}${note?': '+note:''}`);

    note=val('rj-note-'+d.id).trim();

  }
  target.decision=d.dec;target.note=note;target.at=nowStr();
  hist(t,`${u.name} ${d.dec==='accept'?'menyetujui':'menolak'} review${note?': '+note:''}`);
  logEv('review',d.dec==='accept'?'Reviewer menyetujui':'Reviewer menolak',`${t.dept}: ${t.title} — ${u.name}`,u.name);

  const auto=kids(id).length>0;const old=t.status;
  if(['progress','status','start','end'].includes(field)&&auto)return stop('Task induk dihitung otomatis dari sub task. Ubah lewat sub task.');
  if(['progress','status'].includes(field)){const l=lockedBy(t);if(l)return stop('Terkunci: selesaikan '+l+' lebih dulu (urutan wajib).')}
  if(field==='progress'&&t.status==='On Review')return stop('Task sedang direview, progress tidak bisa diubah sampai review selesai.');
  if(field==='progress'){
    let n=Number(String(val).replace(',','.'));if(!isFinite(n))return;n=Math.max(0,Math.min(100,n));
    if(n===t.progress)return;const was=t.progress;t.progress=n;
    const newStatus=t.parent?statusOf(n):(n<=0?'To do':'On Progress');
    if(newStatus==='Done'&&old!=='Done')t.doneOn=TODAY;if(newStatus!=='Done')t.doneOn=null;t.status=newStatus;
    if(newStatus==='Done'&&old!=='Done')notifyNextUnlocked(t);
    afterChange(t,old,`Progress ${fp(was)} → ${fp(n)}${t.status!==old?', status '+old+' → '+t.status:''}`);
  }else if(field==='status'){
    if(val===t.status)return;
    if(t.status==='On Review')return stop('Task sedang direview. Gunakan tombol Accept/Reject (reviewer) atau Closing (PMO).');
    if(t.status==='Revisi')return stop('Task perlu diajukan ulang lewat tombol "Ajukan ulang untuk Review", bukan diubah langsung.');
    if(!t.parent&&val==='Done')return stop('Status Done hanya lewat closing PMO setelah semua reviewer menyetujui.');
    if(val==='Revisi')return stop('Status Revisi hanya terjadi otomatis kalau ada reviewer yang menolak.');
    if(val==='On Review'){
      if(t.parent)return stop('Sub task tidak melalui review. Selesaikan semua sub task, lalu ajukan review dari task induknya.');
      return submitReview({id:t.id});
    }
    let n=t.progress;
    if(val==='To do')n=0;else if(val==='Done')n=100;else if(n<=0||n>=100)n=50;
    const was=t.progress;t.progress=n;t.doneOn=val==='Done'?TODAY:null;t.status=val;
    if(val==='Done'&&old!=='Done')notifyNextUnlocked(t);
    afterChange(t,old,`Status ${old} → ${val} (progress ${fp(was)} → ${fp(n)})`);
  }else if(field==='start'||field==='end'){
    const s=field==='start'?val:t.start,e=field==='end'?val:t.end;
    if(!val)return stop('Tanggal tidak boleh kosong.');
    if(s&&e&&e<s)return stop('Tanggal End tidak boleh sebelum Start.');
    t[field]=val;if(t.parent)recalc(t.parent);hist(t,`${field==='start'?'Start':'End'} diubah ke ${fmt(val)}`);
  }else if(field==='title'){
    const v=String(val).trim();if(!v||v===t.title)return;hist(t,`Judul diubah dari "${t.title}"`);t.title=v;
  }else if(field==='remarks'){
    if(val===t.remarks)return;t.remarks=val;hist(t,'Remarks diperbarui');
  }else if(field==='prio'){
    if(t.parent)return;if(val===t.prio)return;hist(t,`Prioritas ${t.prio} → ${val}`);t.prio=val;
  }else if(field==='restricted'){
    if(!isMgr(me(),t.dept))return deny();t.restricted=!!val;hist(t,t.restricted?'Ditandai Terbatas':'Tanda Terbatas dicabut');
    logEv('task',t.restricted?'Tandai task terbatas':'Cabut tanda terbatas',`${t.dept}: ${t.title}`);
  }else if(field==='sequential'){
    t.sequential=!!val;hist(t,t.sequential?'Urutan wajib diaktifkan':'Urutan wajib dimatikan');
  }
  if(t.restricted)logEv('task','Ubah task terbatas',`${t.dept}: ${t.title}`);
  render();
}
function newTask(o){
  const par=o.parent?byId(o.parent):null;
  const id=mk(o.dept,o.title,{parent:o.parent,pic:o.pic,s:o.start,e:o.end,prio:par?par.prio:o.prio,res:par?false:o.res,by:S.me,r:o.remarks,upd:TODAY+' '+hhmm(),seq:o.seq,project:o.project,reviewers:o.reviewers});

function mineGroups(uid){
  const w1=addDays(mondayOf(TODAY),6);
  const direct=tasks.filter(t=>t.status!=='Done'&&picIds(t).includes(uid)&&canSee(t));
  const rootIds=[...new Set(direct.filter(t=>t.parent).map(t=>t.parent))];
  const roots=rootIds.map(byId).filter(r=>r&&r.status!=='Done'&&!picIds(r).includes(uid));
  const mine=[...direct,...roots];
  const g={late:[],today:[],week:[],later:[]};
  mine.sort((a,b)=>(a.end||'9').localeCompare(b.end||'9')).forEach(t=>{const e=t.end||'9999';if(e<TODAY)g.late.push(t);else if(e===TODAY)g.today.push(t);else if(e<=w1)g.week.push(t);else g.later.push(t)});

}

const newBtn=()=>canCreateSelfTask()?`<button class="btn pri" data-a="newTask">${ic('plus')}Task baru</button>`:'';
function passF(t){
  const f=S.f,ks=kids(t.id),all=[t,...ks];
  if(S.project!=='Semua'&&projectOf(t)!==S.project)return false;
  if(f.pic&&!all.some(x=>picIds(x).includes(f.pic)))return false;
  if(f.prio&&t.prio!==f.prio)return false;
  if(f.due==='late'&&!lateFlag(t))return false;
  if(f.due==='week'&&!all.some(x=>x.end&&x.end>=TODAY&&x.end<=addDays(mondayOf(TODAY),6)&&x.status!=='Done'))return false;
  if((f.from||f.to)&&!all.some(x=>{
    if(!x.start&&!x.end)return false;
    const s=x.start||x.end,e=x.end||x.start;
    if(f.from&&e<f.from)return false;
    if(f.to&&s>f.to)return false;
    return true;
  }))return false;
  if(f.q&&!all.some(x=>x.title.toLowerCase().includes(f.q.toLowerCase())))return false;
  return true;
}

function genProjectCode(name){
  const words=name.trim().split(/\s+/).filter(Boolean);let code;
  if(words.length>1){const init=words.map(w=>w[0]).join('').toUpperCase();code=init.length<3?(words[0].slice(0,3-words.length+1)+words.slice(1).map(w=>w[0]).join('')).toUpperCase():init.slice(0,5)}
  else code=name.slice(0,3).toUpperCase();
  code=code.replace(/[^A-Z0-9]/g,'')||'PRJ';
  let c=code,n=1;while(S.projects.some(p=>p.code===c))c=code+(++n);return c;
}

function gantt(list){
  const W=26,N=28,s0=S.ganttStart;const rows=[];
  list.forEach(p=>{rows.push(p);if(!S.cg[p.id])kids(p.id).forEach(c=>rows.push(c))});
  const wk=[0,1,2,3].map(i=>`<div>${fmtS(addDays(s0,i*7))} – ${fmtS(addDays(s0,i*7+6))}</div>`).join('');
  const days=Array.from({length:N},(_,i)=>{const d=addDays(s0,i);const n=i%7;return `<div class="${n>=5?'we '+(S.wkColor?'on':''):''} ${d===TODAY?'td':''}" title="${fmt(d)}">${'SSRKJSM'[n]}</div>`}).join('');
  const tl=diff(s0,TODAY)>=0&&diff(s0,TODAY)<N?`<u class="tl" style="left:${(diff(s0,TODAY)+.5)*W}px"></u>`:'';
  let body='';
  rows.forEach(t=>{
    const sub=!!t.parent,a=Math.max(0,diff(s0,t.start||TODAY)),b=Math.min(N-1,diff(s0,t.end||TODAY)),out=diff(s0,t.end||TODAY)<0||diff(s0,t.start||TODAY)>N-1;
    const bar=out?'':`<div class="gbar ${sub?'gs':''} ${isLate(t)?'late':''}" style="left:${a*W+2}px;width:${(b-a+1)*W-4}px;--dc:${dcol(t.dept)}" data-a="open" data-id="${t.id}" title="${esc(t.title)}: ${fp(t.progress)}, ${fmtS(t.start)} – ${fmtS(t.end)}"><i style="width:${t.progress}%"></i><span>${fp(t.progress)}</span></div>`;
    body+=`<div class="gr"><div class="gl ${sub?'gs':''}"><span class="no">${NUM[t.id]}</span>${!sub&&kids(t.id).length?`<button class="xp ${S.cg[t.id]?'':'open'}" data-a="toggleG" data-id="${t.id}">${ic('chev')}</button>`:''}<button data-a="open" data-id="${t.id}" ${sub?'':'class="b"'}>${esc(t.title)}</button></div><div class="gt ${S.wkColor?'wk':''}">${bar}${tl}</div></div>`;
  });
  return `<div class="gw"><div class="gr h"><div class="gl">Task</div><div class="gh w">${wk}</div></div><div class="gr h"><div class="gl">Display week: ${fmtS(s0)} – ${fmtS(addDays(s0,N-1))}</div><div class="gh">${days}</div></div>${body||'<div class="empty">Tidak ada task.</div>'}</div>`;
}

  const W=26,N=28,s0=S.ganttStart;

  const headL=`<div class="jl h" style="grid-template-columns:${grid}">${cols.map(c=>`<div>${c.label}</div>`).join('')}</div>`;
  const wk=[0,1,2,3].map(i=>`<div>${fmtS(addDays(s0,i*7))} – ${fmtS(addDays(s0,i*7+6))}</div>`).join('');
  const days=Array.from({length:N},(_,i)=>{const d=addDays(s0,i);const n=i%7;return `<div class="${n>=5?'we '+(S.wkColor?'on':''):''} ${d===TODAY?'td':''}" title="${fmt(d)}">${'SSRKJSM'[n]}</div>`}).join('');
  const tl=diff(s0,TODAY)>=0&&diff(s0,TODAY)<N?`<u class="tl" style="left:${(diff(s0,TODAY)+.5)*W}px"></u>`:'';
  const ps=scoped().filter(t=>!t.parent&&passF(t)).sort((a,b)=>a.ord-b.ord);

  rows.forEach(t=>{
    shownN++;
    const child=!!t.parent,left=jadwalRow(t,child,cols,grid);
    const a=Math.max(0,diff(s0,t.start||TODAY)),b=Math.min(N-1,diff(s0,t.end||TODAY)),out=!t.start||!t.end||diff(s0,t.end)<0||diff(s0,t.start)>N-1;
    const bar=out?'':`<div class="gbar ${child?'gs':''} ${isLate(t)?'late':''}" style="left:${a*W+2}px;width:${(b-a+1)*W-4}px;--dc:${dcol(t.dept)}" data-a="open" data-id="${t.id}" title="${esc(t.title)}: ${fp(t.progress)}, ${fmtS(t.start)} – ${fmtS(t.end)}"><i style="width:${t.progress}%"></i><span>${fp(t.progress)}</span></div>`;

/* ---------- import ---------- */
function matchPic(name){
  const n=name.trim().toLowerCase();
  const ex=users.find(u=>u.name.toLowerCase()===n);if(ex)return{uid:ex.id};
  if(/(\bteam|^tim\b)/i.test(name))return{team:name.trim()};
  const tok=n.replace(/\./g,'').split(/\s+/);
  const cand=users.filter(u=>u.active&&tok.some(x=>x.length>1&&u.name.toLowerCase().split(/\s+/).includes(x))).map(u=>u.id);
  return{cand:cand.length?cand:users.filter(u=>u.active).map(u=>u.id)};
}
const isAmb=s=>/^\d{2}\/\d{2}\/\d{4}$/.test(s||'')&&+s.slice(0,2)<=12&&+s.slice(3,5)<=12;
function parseD(s,f){
  if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return null;
  return f==='mdy'?`${m[3]}-${m[1]}-${m[2]}`:`${m[3]}-${m[2]}-${m[1]}`;
}
function impAnalyze(){
  const u=me(),I=S.imp;
  return IMPORT_ROWS.map((r,i)=>{
    const res=I.res[i]||{};let state='ok',fatal=null,probs=[];
    const par=r.no?r.no.split('.')[0]:'';
    if(!(u.admin||u.role==='Pengelola'))fatal={label:'Ditolak',msg:`Departemen ${r.dept} di luar hak import kamu`};
    else if(r.no&&r.no.includes('.')&&!IMPORT_ROWS.some(x=>x.dept===r.dept&&x.no===par))fatal={label:'Error',msg:`Sub task ${r.no} tidak punya induk ${par}`};
    const upd=r.id?byId(r.id):null;
    if(!fatal&&r.id&&(!upd||!canEdit(upd)))fatal={label:'Ditolak',msg:'Task dengan ID ini tidak bisa kamu ubah'};
    const pm=matchPic(r.pic);let pic=null;
    if(pm.uid)pic={uid:pm.uid};else if(pm.team)pic={team:pm.team};
    else{probs.push('pic');if(res.pic)pic={uid:res.pic}}
    const amb=isAmb(r.start)||isAmb(r.end);if(amb&&!I.dateFmt)probs.push('date');
    const conflict=r.status&&statusOf(r.progress)!==r.status;if(conflict){probs.push('conflict')}
    const open=probs.filter(k=>(k==='pic'&&!res.pic)||(k==='date'&&!I.dateFmt)||(k==='conflict'&&!res.conf));
    if(fatal)state='fatal';else if(res.skip)state='skip';else if(open.length)state='todo';
    let prog=r.progress,stat=r.status;
    if(conflict&&res.conf==='status'){prog=stat==='Done'?100:stat==='To do'?0:50}
    if(conflict&&res.conf==='progress')stat=statusOf(prog);
    return{...r,i,state,fatal,probs,open,pm,pic,res,amb,upd,prog,stat,s:parseD(r.start,I.dateFmt),e:parseD(r.end,I.dateFmt),conflict};
  });
}

  const I=S.imp;let main='';

function impDo(){
  const rows=impAnalyze().filter(r=>r.state==='ok'),map={};let np=0,ns=0,nu=0;
  const bid='B-'+pad(++bseq+1);const pics=new Set();
  const mkT=(r,parent)=>{
    const p=parent?byId(parent):null;
    const id=mk(r.dept,r.task,{parent,p:r.prog,pic:r.pic?[r.pic.uid||r.pic.team]:[],s:r.s,e:r.e,prio:r.prio||'Medium',r:r.remarks,by:S.me,batch:bid,upd:TODAY+' '+hhmm()});
    const t=byId(id);t.history.push({at:nowStr(),who:me().name,text:'Dibuat lewat import '+bid});
    if(r.pic&&r.pic.uid)pics.add(r.pic.uid);return id;
  };
  rows.filter(r=>!r.upd&&!r.no.includes('.')).forEach(r=>{map[r.dept+'|'+r.no]=mkT(r,null);np++});
  rows.filter(r=>!r.upd&&r.no.includes('.')).forEach(r=>{mkT(r,map[r.dept+'|'+r.no.split('.')[0]]);ns++});
  rows.filter(r=>r.upd).forEach(r=>{const t=r.upd;t.progress=r.prog;t.status=statusOf(r.prog);t.remarks=r.remarks||t.remarks;t.history.unshift({at:nowStr(),who:me().name,text:'Diperbarui lewat import '+bid});touch(t);nu++});
  tasks.filter(t=>!t.parent).forEach(t=>recalc(t.id));
  S.batches.unshift({id:bid,file:'task_september.xlsx',by:me().name,at:nowStr(),tasks:np,subs:ns,updated:nu,status:'Aktif'});
  logEv('import','Import selesai',`${np} task, ${ns} sub task, ${nu} diperbarui (${bid})`);
  notify('imp',null,`Import ${bid} selesai: ${np} task dan ${ns} sub task baru untukmu dan timmu`,[...pics]);
  S.notifs.unshift({id:'n'+(++nseq),uid:S.me,type:'imp',tid:null,text:`Import ${bid} selesai: ${np} task, ${ns} sub task`,at:'21 Sep, '+hhmm(),read:false});
  S.imp={stage:'done',res:{},dateFmt:null};
}

function repRows(){
  const ps=scoped().sort((a,b)=>DEPTS.findIndex(d=>d.id===a.dept)-DEPTS.findIndex(d=>d.id===b.dept)||a.ord-b.ord);
  const w0=mondayOf(TODAY),m0=TODAY.slice(0,8)+'01',m1=addDays(TODAY.slice(0,8)+'01',30);
  const rng={all:null,week:[w0,addDays(w0,6)],month:[m0,m1.slice(0,7)===TODAY.slice(0,7)?m1:TODAY.slice(0,8)+'30'],next30:[TODAY,addDays(TODAY,30)]}[S.rep.period];
  const flat=[];
  S.projects.forEach(pr=>ps.filter(t=>!t.parent&&t.project===pr.id).forEach(p=>{flat.push(p);kids(p.id).forEach(c=>flat.push(c))}));
  return flat.filter(t=>!rng||(t.start<=rng[1]&&t.end>=rng[0]));
}

function pfCheckStrength(){
  const el1=document.getElementById('pf-p1');if(!el1)return;
  const v=el1.value;
  const hasLen=v.length>=10,hasCase=/[a-z]/.test(v)&&/[A-Z]/.test(v),hasNum=/\d/.test(v),hasSym=/[^A-Za-z0-9]/.test(v);
  const score=[hasLen,hasCase,hasNum,hasSym].filter(Boolean).length;
  for(let i=1;i<=4;i++){const bar=document.getElementById('pf-bar-'+i);if(bar)bar.className=i<=score?'on'+score:''}
  const setReq=(id,ok,label)=>{const el=document.getElementById(id);if(el)el.innerHTML=(ok?'✓ ':'○ ')+label};
  setReq('pf-req-len',hasLen,'Minimal 10 karakter');
  setReq('pf-req-case',hasCase,'Huruf besar &amp; kecil');
  setReq('pf-req-num',hasNum,'Mengandung angka');
  setReq('pf-req-sym',hasSym,'Mengandung simbol');
}
function prShortRp(n){return n>=1e9?(n/1e9)+' M':n>=1e6?(n/1e6)+' jt':'Rp '+Math.round(n).toLocaleString('id-ID')}
function prSortedTiers(){return (S.set.prTiers||[]).slice().sort((a,b)=>(a.max==null?Infinity:a.max)-(b.max==null?Infinity:b.max))}
function prTierHitIdx(amt,tiers){return tiers.findIndex((t,i)=>{const min=i>0?tiers[i-1].max:0;return amt>min&&(t.max==null||amt<=t.max)})}
function prPillHtml(l){
  return l.kind==='dynamic'?`<span class="pill dyn"><span class="av" style="background:none;color:inherit">?</span>Manajer departemen <small>sesuai pemohon</small></span>`
  :`<span class="pill">${avatar({uid:l.uid})}${esc(uname(l.uid))} <small>${esc((users.find(u=>u.id===l.uid)||{}).role||'')}</small></span>`;
}
function prTierListHtml(tiers,hitIdx){
  return tiers.map((t,i)=>{
    const min=i>0?tiers[i-1].max:0;
    const range=t.max==null?`di atas <strong>${prShortRp(min)}</strong>`:min===0?`sampai <strong>${prShortRp(t.max)}</strong>`:`<strong>${prShortRp(min)} – ${prShortRp(t.max)}</strong>`;
    const lvl=t.layers.length<=1?'l1':t.layers.length===2?'l2':'l3';
    return `<div class="rule ${i===hitIdx?'hit':''}"><div class="rh"><span class="rn">${i+1}</span><div class="t"><b>${esc(t.label)}</b> <span class="match">· cocok dengan simulasi</span><div class="range">Total ${range}</div></div><span class="lvl ${lvl}">${t.layers.length} layer</span><button class="btn ghost s" data-a="prTierEditOpen" data-id="${t.id}">Edit</button></div>
    <div class="rb"><div><div class="lbl">Layer approval (berurutan)</div><div class="chain">${t.layers.map((l,j)=>(j?'<span class="arrow">→</span>':'')+prPillHtml(l)).join('')||'<span class="mut sm">Belum ada layer.</span>'}</div></div>
    <div class="cc-box"><div class="lbl">CC · hanya mengetahui</div>${(t.cc||[]).map(c=>`<span class="pill">${avatar({uid:c.uid})}${esc(uname(c.uid))} <small>${esc((users.find(u=>u.id===c.uid)||{}).role||'')}</small></span>`).join('')||'<span class="mut sm">Tidak ada CC.</span>'}${t.ccNote?`<div class="cc-note">${esc(t.ccNote)}</div>`:''}</div></div></div>`;
  }).join('');
}
function prSimResultHtml(sim,tiers,hitIdx){
  if(hitIdx===-1)return '<p class="sm mut">Tidak ada aturan yang cocok untuk nominal ini.</p>';
  const t=tiers[hitIdx];
  const mgrId=resolveDeptManagerByDept(sim.dept);
  const layerPeople=t.layers.map(l=>l.kind==='dynamic'?{uid:mgrId,role:'Manajer '+sim.dept}:{uid:l.uid,role:(users.find(u=>u.id===l.uid)||{}).role||''});
  const steps=[{k:'Pemohon',name:'Staf '+sim.dept,role:'Mengajukan',uid:null},
    {k:'GA',name:uname(S.set.prGA),role:'Perbandingan harga',uid:S.set.prGA},
    ...layerPeople.map((l,j)=>({k:'Layer '+(j+1),name:uname(l.uid),role:l.role,uid:l.uid})),
    {k:'Selesai',name:'Diarsipkan',role:'Semua setuju',uid:null,done:1}];
  const lvl=t.layers.length<=1?'l1':t.layers.length===2?'l2':'l3';
  return `<div class="res-head"><b>${prShortRp(sim.amt).startsWith('Rp')?prShortRp(sim.amt):'Rp '+sim.amt.toLocaleString('id-ID')} · departemen ${esc(sim.dept)} → Aturan ${hitIdx+1} (${esc(t.label)})</b><span class="lvl ${lvl}">${t.layers.length} layer</span></div>
  <div class="flow">${steps.map(s=>`<div class="st"><span class="av" style="${s.uid?'background:hsl('+hue(s.uid)+' 32% 38%)':'background:var(--line)'}">${s.done?'✓':s.uid?initials(uname(s.uid)):initials(s.name)}</span><div class="k">${s.k}</div><div class="w">${esc(s.name)}</div><div class="r">${esc(s.role)}</div></div>`).join('')}</div>
  <div class="res-cc"><span class="t-cc">CC</span><div class="avs">${(t.cc||[]).map(c=>avatar({uid:c.uid})).join('')}</div><span>${(t.cc||[]).map(c=>esc(uname(c.uid))).join(', ')||'Tidak ada'} menerima pemberitahuan &amp; bisa export PDF.</span></div>`;
}

/* ================= render ================= */
function render(){
  const act=document.activeElement,fid=act&&act.id,ss=act&&act.selectionStart,se=act&&act.selectionEnd;
  const sels=['.main','.db','.gw','.ph-b','.tw','.kb'],sv=[];
  sels.forEach(s=>document.querySelectorAll(s).forEach((el,i)=>sv.push([s,i,el.scrollTop,el.scrollLeft])));
  NUM=buildNum();
  $('#app').innerHTML=S.screen==='app'?shell():authScreen();
  sv.forEach(([s,i,t,l])=>{const el=document.querySelectorAll(s)[i];if(el){el.scrollTop=t;el.scrollLeft=l}});
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{el.setSelectionRange(ss,se)}catch(e){}}}
}
const go=r=>{S.route=r;if(r!=='papan')S.planBanner=null;S.openId=null;S.modal=null;render();const m=$('#main');if(m)m.scrollTop=0};

/* ================= actions ================= */
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const A={
  gopen(){S.modal={type:'gchoose'};render()},
  dateFilterOpen(){S.modal={type:'daterange',month:ymOf(S.f.from),from:S.f.from,to:S.f.to};render()},
  drPrev(){S.modal.month=addMonths(S.modal.month,-1);render()},
  drNext(){S.modal.month=addMonths(S.modal.month,1);render()},
  drPick(d){
    const m=S.modal,day=d.d;
    if(!m.from||m.to){m.from=day;m.to='';}
    else if(day<m.from){m.to=m.from;m.from=day;}
    else{m.to=day;}
    render();
  },
  drClearAll(){S.modal.from='';S.modal.to='';render()},
  drApply(){
    S.f.from=S.modal.from;S.f.to=S.modal.to;
    if(S.f.from)S.ganttStart=mondayOf(S.f.from);
    S.modal=null;render();
  },
  gpick(d){S.modal=null;loginAs(d.id)},
  mclose(){S.modal=null;render()},
  login(){
    const em=val('l-email').trim().toLowerCase(),pw=val('l-pass');
    if(!em){S.err='Isi email dulu.';return render()}
    if(S.fails>=5){S.err='Terlalu banyak percobaan. Coba lagi dalam 15 menit. (Batas percobaan login aktif.)';return render()}
    const u=users.find(x=>x.email===em||x.extra.includes(em));
    if(!u){
      if(S.pending.some(p=>p.email===em)){S.waitEmail=em;S.screen='waiting';return render()}
      S.err='Email ini belum diundang. Minta undangan atau ajukan akses.';return render();
    }
    if(pw.length<10){S.fails++;S.err='Password minimal 10 karakter.'+(S.fails>=3?` (${5-S.fails} percobaan tersisa)`:'');return render()}
    S.fails=0;loginAs(u.id);
  },
  demo(d){loginAs(d.id)},
  forgot(){toast('Tautan reset password dikirim ke email (simulasi).')},
  toRequest(){S.screen='request';S.err='';S.reqForm=null;render()},
  toLogin(){S.screen='login';S.err='';S.modal=null;S.inv=null;render()},
  twofa(){if(!/^\d{6}$/.test(val('tf').trim())){S.err='Kode harus 6 digit.';return render()}enter(S.tmp)},
  twofaFill(){document.getElementById('tf').value='482913'},
  request(){
    const n=val('r-name').trim(),e=val('r-email').trim().toLowerCase(),dept=val('r-dept'),p1=val('r-p1'),p2=val('r-p2');
    S.reqForm={name:n,email:e,dept};
    if(!n||!/^\S+@\S+\.\S+$/.test(e)){S.err='Isi nama dan email yang valid.';return render()}
    if(users.some(u=>u.email===e)){S.err='Email ini sudah punya akun. Silakan masuk.';return render()}
    if(p1.length<10){S.err='Password minimal 10 karakter.';return render()}
    if(p1!==p2){S.err='Konfirmasi password tidak sama.';return render()}
    if(!S.pending.some(p=>p.email===e))S.pending.push({id:'p'+(++useq),name:n,email:e,dept,at:nowStr()});
    logEv('akses','Permintaan akses',e,n);
    const pendingId=S.pending.find(p=>p.email===e).id;
    notify('akses',null,`${n} meminta akses baru`,mgrIds(),{kind:'pending',id:pendingId});
    S.waitEmail=e;S.reqForm=null;S.screen='waiting';render();
  },
  openInvite(d){S.inv={id:d.id,step:1};S.screen='invite';S.err='';S.modal=null;render()},
  invGoogle(){S.inv.mode='google';A.invFinish()},
  invPass(){S.inv.step=2;S.err='';render()},
  invPass2(){const a=val('iv-p1'),b=val('iv-p2');if(a.length<10){S.err='Password minimal 10 karakter.';return render()}if(a!==b){S.err='Kedua password harus sama.';return render()}S.inv.mode='pass';S.inv.step=3;S.err='';render()},
  invFill(){document.getElementById('iv-code').value='739204'},
  invVerify(){if(!/^\d{6}$/.test(val('iv-code').trim())){S.err='Kode harus 6 digit.';return render()}A.invFinish()},
  invFinish(){
    const iv=S.invites.find(i=>i.id===S.inv.id);iv.status='Diterima';

    if(isExt(u))u.expires=addDays(TODAY,S.set.expiry*30);
    users.push(u);
    logEv('akses','Pengguna ditambahkan langsung',`${email} sebagai ${role}${depts.length?' · '+depts.join(', '):''}`);
    S.modal=null;render();toast(name+' ditambahkan dan langsung aktif.');
  },
  auDeptAdd(){
    const m=S.modal;
    const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};
    if(g('au-name')!==undefined)m.name=g('au-name');
    if(g('au-email')!==undefined)m.email=g('au-email');
    if(g('au-via')!==undefined)m.via=g('au-via');
    if(g('au-role')!==undefined)m.role=g('au-role');
    m.depts=Array.from(document.querySelectorAll('.au-dept-cb:checked')).map(x=>x.value);
    const name=val('au-dept-new').trim();if(!name)return;
    if(!DEPTS.some(d=>d.id.toLowerCase()===name.toLowerCase())){
      const palette=['#0E7C86','#B7791F','#7B4B94','#B5533C','#3468D6','#2C9A68','#B23A3A','#5FB79E'];
      DEPTS.push({id:name,full:name,color:palette[DEPTS.length%palette.length]});
      logEv('role','Menambah departemen baru',name,me().name);
    }
    if(!m.depts.includes(name))m.depts.push(name);
    render();toast('Departemen "'+name+'" ditambahkan dan dicentang.');
  },
  rolesEditOpen(d){if(!me().admin)return deny();S.modal={type:'editRoles',id:d.id};render()},
  rolesEditSave(d){
    if(!me().admin)return deny();
    const u=users.find(x=>x.id===d.id);
    const er=m=>{document.getElementById('re-err').textContent=m};
    const newRole=val('re-role');
    if(u.role==='Administrator'&&newRole!=='Administrator'&&lastAdmin(u))return er('Administrator terakhir tidak bisa diturunkan. Tambah Administrator lain dulu.');
    const wasRole=u.role;
    u.role=newRole;u.admin=newRole==='Administrator';
    u.depts=Array.from(document.querySelectorAll('.re-dept-cb:checked')).map(x=>x.value);
    logEv('role','Perubahan role & akses',`${u.name}: ${wasRole} → ${newRole}${u.depts.length?' · '+u.depts.join(', '):''}`);
    S.modal=null;render();toast('Role dan akses diperbarui.');
  }
};
const C={
  avatarFile(el){
    const f=el.files&&el.files[0];if(!f)return;
    if(f.size>2*1024*1024)return toast('Ukuran foto maksimal 2MB.','warn');
    const reader=new FileReader();
    reader.onload=()=>{me().avatar=reader.result;render();toast('Foto profil diperbarui.')};
    reader.readAsDataURL(f);
  },
  switch(el){if(!el.value)return;const id=el.value;S.me=id;S.route='beranda';S.dept='Semua';S.openId=null;S.modal=null;S.and={tab:'task',sheet:null,banner:null};toast('Simulasi: sekarang sebagai '+uname(id)+' ('+roleLabel(users.find(u=>u.id===id))+').');render()},
  q(el){S.f.q=el.value;render()},fpic(el){S.f.pic=el.value;render()},fprio(el){S.f.prio=el.value;render()},fdue(el){S.f.due=el.value;render()},
  jwcol(el){S.jwCols[el.dataset.k]=el.checked;render()},
  gjump(el){if(el.value)S.ganttStart=mondayOf(el.value);render()},
  mv(el){applyField(el.dataset.id,'status',el.value)},
  prog(el){applyField(el.dataset.id,'progress',el.value)},status(el){applyField(el.dataset.id,'status',el.value)},
  prio(el){applyField(el.dataset.id,'prio',el.value)},start(el){applyField(el.dataset.id,'start',el.value)},end(el){applyField(el.dataset.id,'end',el.value)},
  remarks(el){applyField(el.dataset.id,'remarks',el.value)},title(el){applyField(el.dataset.id,'title',el.value)},
  restr(el){applyField(el.dataset.id,'restricted',el.checked)},seq(el){applyField(el.dataset.id,'sequential',el.checked)},
  wkc(el){S.wkColor=el.checked;render()},period(el){S.rep.period=el.value;render()},
  unread(el){S.notifOnlyUnread=el.checked;render()},
  notifFilter(d){S.notifFilter=d.k;render()},
  pref(el){me().prefs[el.dataset.k]=el.checked;toast(el.checked?'Notifikasi diaktifkan.':'Notifikasi dimatikan.')},
  logf(el){S.logF=el.value;render()},
  ntDept(el){captureNewTaskForm();S.modal.dept=el.value;render()},
  deptSel(el){S.dept=el.value;render()},
  prTierLayerKind(el){
    captureTierForm();
    const l=S.modal.tier.layers[+el.dataset.i];
    if(el.value==='dynamic'){l.kind='dynamic';delete l.uid}else{l.kind='fixed';l.uid=el.value}
    render();
  },
  prTierCCNote(el){captureTierForm();S.modal.tier.cc[+el.dataset.i].note=el.value;render()},
  prSimDept(el){S.prSim=S.prSim||{};S.prSim.dept=el.value;render()},
  planNewProj(el){
    const m=S.modal;if(!m||m.type!=='planNew')return;capturePlanNew();m.proj=el.value;
    const p=S.projects.find(x=>x.id===el.value);if(p&&!(m.name||'').trim())m.name=p.name;
    render();
  },
  planMoveTarget(el){const m=S.modal;if(!m||m.type!=='planMove')return;capturePlanBulk();m.target=el.value;render()},
  planRowField(el){const m=S.modal;if(!m||m.type!=='planMove')return;capturePlanBulk();m.rows[+el.dataset.i][el.dataset.f]=el.value;render()},
  prItemField(el){
    const m=S.modal;if(!m||m.type!=='newPR')return;
    capturePRForm();
    m.items[+el.dataset.pi][el.dataset.pri]=el.value;
    render();
  },
  prEItemField(el){
    const pr=prById(S.prOpenId);if(!pr)return;
    capturePREditForm(pr);
    pr.items[+el.dataset.pi][el.dataset.pri]=el.value;
    render();
  },
  prRecommend(el){
    const pr=prById(el.dataset.id);if(S.set.prGA!==me().id||pr.status!=='Menunggu GA')return;
    pr.recommendedIdx=el.value===''?null:+el.value;
    if(pr.recommendedIdx===prCheapestIdx(pr))pr.recommendReason='';
    render();
  },
  desktopToggle(el){
    S.set.desktopNotif=el.checked;
    if(el.checked&&typeof Notification!=='undefined'&&Notification.permission==='default'){
      Notification.requestPermission().then(perm=>{
        if(perm!=='granted'){toast('Izin notifikasi browser ditolak. Nyalakan lewat pengaturan browser kalau berubah pikiran.','warn')}
        render();
      });
    }
    render();
  },
  fileUp(el){
    const t=byId(el.dataset.id);if(!canEdit(t))return deny();
    const files=Array.from(el.files||[]);if(!files.length)return;
    let remaining=files.length;
    files.forEach(f=>{
      if(f.size>3*1024*1024){toast(f.name+' terlalu besar (maks 3 MB).','warn');remaining--;if(remaining===0)render();return}
      const reader=new FileReader();
      reader.onload=()=>{
        t.attachments=t.attachments||[];
        t.attachments.push({name:f.name,size:f.size,data:reader.result,by:me().name,at:nowStr()});
        hist(t,'Lampiran ditambahkan: '+f.name);
        remaining--;
        if(remaining===0){render();toast('Lampiran diunggah.')}
      };
      reader.readAsDataURL(f);
    });
  },
  projSel(el){S.project=el.value;render()},
  projChange(el){
    const t=byId(el.dataset.id);if(!isPMO())return deny();
    if(t.parent)return;
    const old=projName(t.project);t.project=el.value;
    hist(t,'Project dipindahkan: '+old+' → '+projName(t.project));
    logEv('project','Task dipindahkan ke project lain',`${t.dept}: ${t.title} — ${old} → ${projName(t.project)}`,me().name);
    render();toast('Project dipindahkan.');
  },
  dfmt(el){S.imp.dateFmt=el.value;render()},
  impPic(el){const r=S.imp.res[el.dataset.i]||(S.imp.res[el.dataset.i]={});r.pic=el.value;render()},
  impConf(el){const r=S.imp.res[el.dataset.i]||(S.imp.res[el.dataset.i]={});r.conf=el.value;render()},
  set(el){
    S.set[el.dataset.k]=el.checked;
    if(el.dataset.k==='weighted')tasks.filter(t=>!t.parent).forEach(t=>recalc(t.id));
    logEv('pengaturan','Pengaturan diubah',`${el.dataset.k} = ${el.checked?'nyala':'mati'}`);
    toast(el.dataset.k==='weighted'?'Progress induk dihitung ulang ('+(el.checked?'berbobot durasi':'jumlah sub task selesai')+').':'Pengaturan disimpan.');render();
  },
  expiry(el){S.set.expiry=+el.value;logEv('pengaturan','Masa berlaku akses eksternal',el.value+' bulan');toast('Disimpan. Berlaku untuk akun eksternal baru.')},
  andProg(el){applyField(el.dataset.id,'progress',el.value)},
  andSub(el){applyField(el.dataset.id,'status',el.checked?'Done':'To do')}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a)return;
  if(e.target!==a&&e.target.closest('select,input,textarea')&&!a.matches('select,input,textarea'))return;
  if(a.matches('.ov')&&e.target!==a)return;
  const fn=A[a.dataset.a];if(fn)fn({...a.dataset});
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-c]');if(!el)return;
  const fn=C[el.dataset.c];if(fn)fn(el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='plan-q'){S.planQ=e.target.value;const pl=document.getElementById('plan-list');if(pl)pl.innerHTML=planListHtml();return}
  if(e.target.id==='pf-p1')pfCheckStrength();
});
document.addEventListener('change',e=>{
  if(e.target.id==='pf-avatar-file')A.avatarUpload(e.target);
});
document.addEventListener('input',e=>{
  if(e.target.id!=='pr-sim-amt')return;
  const digits=e.target.value.replace(/\D/g,'');
  e.target.value=digits?(+digits).toLocaleString('id-ID'):'';
  S.prSim=S.prSim||{amt:0,dept:DEPTS[0]&&DEPTS[0].id};
  S.prSim.amt=+digits||0;
  const tiers=prSortedTiers(),hitIdx=prTierHitIdx(S.prSim.amt,tiers);
  const rl=document.getElementById('pr-rules-list');if(rl)rl.innerHTML=prTierListHtml(tiers,hitIdx);
  const rs=document.getElementById('pr-sim-result');if(rs)rs.innerHTML=prSimResultHtml(S.prSim,tiers,hitIdx);
});
document.addEventListener('input',e=>{
  if(e.target.id==='pf-p1')pfCheckStrength();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const el=e.target.closest('[data-enter]');if(el&&A[el.dataset.enter]){e.preventDefault();A[el.dataset.enter]({...el.dataset})}}
  if(e.key==='Escape'){if(S.modal){S.modal=null;render()}else if(S.openId){S.openId=null;render()}}
});
/* drag and drop */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-card]');if(!c)return;dragId=c.dataset.card;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(!c||!dragId)return;e.preventDefault();document.querySelectorAll('.kc.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(!c||!dragId)return;e.preventDefault();const id=dragId;dragId=null;applyField(id,'status',c.dataset.col)});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.kc.over').forEach(x=>x.classList.remove('over'))});
render();
})();
</script>
</body>
</html>
